/* =====================================================================================
   ARCHITECTURE OVERVIEW (audited data-upgrade architecture)
   =====================================================================================
   This file is intentionally organised into five logically separate layers. They live
   in one script for deployability, but each has a single responsibility and a narrow
   boundary with the others, so any one of them (most importantly the AI layer and the
   UI layer) can be swapped out without touching the permanent data records:

   1. PERMANENT DATA LAYER  (search: "DATA LAYER")
      Owns state.*, schema versioning, migrations, backups, soft-deletion, edit/category
      history, import/export validation, duplicate protection, and error logging.
      Nothing here knows about the DOM or about Claude. See `DataLayer` at the bottom of
      the script for the consolidated read/write surface other layers should use.

   2. AI ANALYSIS LAYER  (search: "AI LAYER")
      Everything that calls the Anthropic API (categorisation + advisor). It only ever
      *proposes* values; the Data Layer is what actually writes them to a record. See
      `AiLayer` for the consolidated surface.

   3. BUSINESS-LOGIC LAYER  (search: "BUSINESS LAYER")
      Pure domain computation with no side effects: category-tree resolution, date-range
      math, planned-vs-actual comparisons, analysis facts, drilldown filtering. See
      `BusinessLayer`.

   4. USER-INTERFACE LAYER  (search: "UI LAYER")
      All render-prefixed and bind-prefixed functions and DOM event wiring.

   5. INTEGRATION LAYER  (search: "INTEGRATION LAYER")
      Browser/external touchpoints: window.storage persistence, the Anthropic fetch call,
      Web Speech API, file import/export (FileReader/Blob).
   ===================================================================================== */

const APP_VERSION = '1.5.0';
const SCHEMA_VERSION = 5;

// ---- Storage adapter -------------------------------------------------------------
// Inside Claude the host provides Store. Downloaded and opened directly on a
// phone or desktop that doesn't exist, so we fall back to the browser's own localStorage.
// Same async shape either way, so nothing else in the app needs to know the difference.
const IS_HOSTED = !!(typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');
const Store = IS_HOSTED ? window.storage : {
  async get(k){
    const v = localStorage.getItem(k);
    if(v===null) throw new Error('Key not found: '+k);
    return {key:k, value:v, shared:false};
  },
  async set(k,v){ localStorage.setItem(k,v); return {key:k, value:v, shared:false}; },
  async delete(k){ localStorage.removeItem(k); return {key:k, deleted:true, shared:false}; },
  async list(prefix){
    const keys=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!prefix || k.startsWith(prefix)) keys.push(k);
    }
    return {keys, prefix, shared:false};
  },
};

// ---- Automatic backups (used before every migration, and on-demand from the Upgrade Centre) ----
async function backupSnapshot(reason){
  const savedAt = Date.now();
  const key = 'rti-backup-'+savedAt;
  try{
    const snap = {schemaVersion: state.schemaVersion, savedAt, reason, data: JSON.stringify(state)};
    await Store.set(key, JSON.stringify(snap));
    let idx = [];
    try{
      const idxRes = await Store.get('rti-backups-index');
      idx = idxRes && idxRes.value ? JSON.parse(idxRes.value) : [];
    }catch(e){ idx = []; }
    idx.push({key, savedAt, reason, schemaVersion: state.schemaVersion});
    while(idx.length>10){
      const old = idx.shift();
      try{ await Store.delete(old.key); }catch(e){ /* fine if already gone */ }
    }
    await Store.set('rti-backups-index', JSON.stringify(idx));
    state.lastBackupAt = savedAt;
    state.lastBackupKey = key;
    return key;
  }catch(e){
    logError('backup', 'Failed to create backup', e && e.message);
    return null;
  }
}
async function listBackups(){
  try{
    const res = await Store.get('rti-backups-index');
    const idx = res && res.value ? JSON.parse(res.value) : [];
    return idx.slice().sort((a,b)=>b.savedAt-a.savedAt);
  }catch(e){ return []; }
}
async function refreshBackupsList(){
  ui.backupsList = await listBackups();
  render();
}
async function restoreBackup(key){
  try{
    await backupSnapshot('pre-restore-safety-backup');
    const res = await Store.get(key);
    if(!res || !res.value) throw new Error('Backup not found in storage.');
    const snap = JSON.parse(res.value);
    const restored = JSON.parse(snap.data);
    state = restored;
    await runMigrations(); // bring an older backup forward safely, never destructively
    scheduleSave();
    return true;
  }catch(e){
    logError('restore', 'Failed to restore backup '+key, e && e.message);
    return false;
  }
}

// ---- Schema migrations: versioned, additive-only, transactional (run on a clone; only
// committed to live state if the migration completes without throwing) ----
const MIGRATIONS = [
  {
    version: 1,
    description: 'Add category-tree fields (parentId/archived/history); migrate legacy free-text subcategories into real nodes; backfill activity reviewFlags/followUpDate.',
    migrate(s){
      s.categories.forEach(c=>{
        if(c.parentId===undefined) c.parentId=null;
        if(c.archived===undefined) c.archived=false;
        if(c.mergedInto===undefined) c.mergedInto=null;
        if(!Array.isArray(c.history)) c.history=[{ts:c.createdAt||Date.now(), action:'created', detail:''}];
      });
      s.activities.forEach(a=>{
        if(a.subcategory && typeof a.subcategory==='string' && a.subcategory.trim() && a.categoryId){
          const parent = s.categories.find(c=>c.id===a.categoryId);
          if(parent){
            let parentId=null, leafId=null;
            [parent.name, a.subcategory.trim()].forEach(name=>{
              let existing = s.categories.find(c=>c.parentId===parentId && c.name.trim().toLowerCase()===name.trim().toLowerCase());
              if(!existing){ existing = {id:uid('cat'), name, parentId, color: parentId? (parent.color||'#8a7d73') : '#8a7d73', archived:false, mergedInto:null, history:[{ts:Date.now(),action:'created',detail:'migration'}]}; s.categories.push(existing); }
              leafId = existing.id; parentId = existing.id;
            });
            if(leafId) a.categoryId = leafId;
          }
          a.subcategory = null;
        }
        if(!Array.isArray(a.reviewFlags)) a.reviewFlags=[];
        if(a.followUpDate===undefined) a.followUpDate=null;
      });
    }
  },
  {
    version: 2,
    description: 'Add soft-deletion + audit fields to goals and rules; add editHistory container to activities; initialise history/error/backup containers.',
    migrate(s){
      if(!Array.isArray(s.plannedActivities)) s.plannedActivities=[];
      if(!Array.isArray(s.recommendationFeedback)) s.recommendationFeedback=[];
      if(!Array.isArray(s.aiAnalysisHistory)) s.aiAnalysisHistory=[];
      if(!Array.isArray(s.migrationLog)) s.migrationLog=[];
      if(!Array.isArray(s.errorLog)) s.errorLog=[];
      s.goals.forEach(g=>{ if(g.deletedAt===undefined) g.deletedAt=null; if(g.createdAt===undefined) g.createdAt=Date.now(); });
      s.rules.forEach(r=>{ if(r.deletedAt===undefined) r.deletedAt=null; if(r.createdAt===undefined) r.createdAt=Date.now(); });
      s.activities.forEach(a=>{ if(!Array.isArray(a.editHistory)) a.editHistory=[]; });
    }
  },
  {
    version: 3,
    description: 'Upgrade goals to structured, measurable tracking rules (title/metric/match); legacy free-text goals are kept and flagged for on-demand AI conversion rather than being dropped. Add goal-review history container.',
    migrate(s){
      s.goals.forEach(g=>{
        if(g.metric===undefined){
          g.rawText = g.rawText || g.text || '';
          g.title = g.title || g.rawText;
          g.metric = null;
          g.match = null;
          g.legacy = true;
          g.aiSuggested = false;
        }
      });
      if(!Array.isArray(s.goalReviewHistory)) s.goalReviewHistory = [];
    }
  },
  {
    version: 4,
    description: 'Add first-run onboarding flag — existing users with data already recorded are marked as having seen it, so onboarding only appears for genuinely new users.',
    migrate(s){
      if(s.onboardingSeen===undefined) s.onboardingSeen = (s.activities||[]).length>0;
    }
  },
  {
    version: 5,
    description: 'Add a managed Projects list so projects can be picked from a dropdown and renamed/removed. Seeded from project names already used in existing activities — no existing data is changed.',
    migrate(s){
      if(!Array.isArray(s.projects)) s.projects=[];
      const seen = new Set(s.projects.map(p=>(p.name||'').trim().toLowerCase()));
      const add = name=>{
        const n=(name||'').trim();
        if(!n || seen.has(n.toLowerCase())) return;
        seen.add(n.toLowerCase());
        s.projects.push({id:uid('proj'), name:n, createdAt:Date.now(), deletedAt:null, history:[{ts:Date.now(),action:'created',detail:'from existing activities'}]});
      };
      (s.activities||[]).forEach(a=>add(a.project));
      (s.plannedActivities||[]).forEach(p=>add(p.project));
    }
  },
];

async function runMigrations(){
  if(state.schemaVersion===undefined || state.schemaVersion===null) state.schemaVersion=0;
  const pending = MIGRATIONS.filter(m=>m.version>state.schemaVersion).sort((a,b)=>a.version-b.version);
  if(pending.length===0) return;
  const backupKey = await backupSnapshot('pre-migration-to-v'+pending[pending.length-1].version);
  for(const m of pending){
    let clone;
    try{ clone = JSON.parse(JSON.stringify(state)); }
    catch(e){ logError('migration', 'Could not clone state before migration v'+m.version, e && e.message); break; }
    try{
      m.migrate(clone);
      clone.schemaVersion = m.version;
      clone.migrationLog = clone.migrationLog || [];
      clone.migrationLog.push({version:m.version, description:m.description, appliedAt:Date.now(), status:'success', backupKey});
      state = clone; // commit only on success — never a partial/destructive write
    }catch(e){
      logError('migration', 'Migration v'+m.version+' failed — data left unchanged', e && e.message);
      state.migrationLog = state.migrationLog || [];
      state.migrationLog.push({version:m.version, description:m.description, appliedAt:Date.now(), status:'failed', error:(e&&e.message)||'unknown error', backupKey});
      break; // stop; state.schemaVersion stays at the last successful version, nothing partial is applied
    }
  }
  scheduleSave();
}

// ---------------- AI calls ----------------
async function callClaude(promptText, systemText){
  const body = {
    model: "claude-sonnet-4-6",
    max_tokens: 1000,
    messages:[{role:"user", content: promptText}]
  };
  if(systemText) body.system = systemText;

  const headers = {"Content-Type":"application/json"};
  if(!IS_HOSTED){
    const key = getApiKey();
    if(!key) throw new Error('NO_API_KEY');
    // Anthropic requires this opt-in header for requests made straight from a browser.
    headers['x-api-key'] = key;
    headers['anthropic-version'] = '2023-06-01';
    headers['anthropic-dangerous-direct-browser-access'] = 'true';
  }

  const resp = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST", headers, body: JSON.stringify(body)
  });
  const data = await resp.json();
  if(data && data.error) throw new Error(data.error.message || 'API error');
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return text;
}
function stripJsonFence(t){ return t.replace(/```json/g,'').replace(/```/g,'').trim(); }

function findMatchingRule(text){
  const t = (text||'').toLowerCase();
  return activeRules().find(r=> r.pattern && t.includes(r.pattern.toLowerCase()));
}

function buildCategorizePrompt(a, matchedRule){
  const tree = catTreeText();
  const ruleList = state.rules.map(r=>`"${r.pattern}" -> ${catBreadcrumbStr(r.categoryId)}`).join('; ') || 'none';

  const sys = `You are a precise personal-productivity analyst. You extract structured data from a single freeform activity log entry written by a busy executive (Raheel) who runs ElevateBiz360 (a UAE business consultancy) and also does banking-relationship work with RAKBANK. Respond ONLY with a single valid JSON object, no preamble, no markdown fences, no commentary. When you are not confident about a field, still choose your single best guess for it (never leave a guessable field null just because you're unsure) and list that field's key in "uncertainFields" instead.

CATEGORY DISCIPLINE — this matters a lot:
- The existing category tree (below) is the source of truth. Always prefer reusing an existing branch over inventing a new one.
- Treat wording differences as the SAME category when the underlying activity is the same kind of work. For example "Marketing", "Social Media Marketing", "Social Posts" and "Facebook Marketing" are all the same concept and must resolve to one single node such as ElevateBiz360 → Marketing → Social Media — never create sibling categories for near-duplicate concepts.
- Only create a new node when the activity genuinely does not fit anywhere in the existing tree. When you do, nest it under the most relevant existing parent rather than adding it at the top level.
- Return the category as a path from top-level down to the most specific applicable node, e.g. ["ElevateBiz360","Marketing","Social Media"]. A path can be 1, 2, or 3 levels — only go as deep as the entry actually supports.`;

  const ruleNote = matchedRule
    ? `\nNote: a saved categorisation rule already matched this entry ("${matchedRule.pattern}" → ${catBreadcrumbStr(matchedRule.categoryId)}). The category is fixed by that rule — still return your best categoryPath guess for completeness, but focus your effort on the other fields.`
    : '';

  const prompt = `Existing category tree:
${tree}

Existing user-defined categorisation rules (these are enforced automatically, shown for context): ${ruleList}${ruleNote}

Activity entry (original, verbatim): """${a.originalInput}"""
Known date (activity date, use this as "today" for resolving relative dates like "tomorrow"): ${a.date}.
Known start time: ${a.startTime||'unknown'}. Known end time: ${a.endTime||'unknown'}.

Return JSON with exactly these keys:
{
 "title": short 5-8 word title,
 "categoryPath": array of 1-3 strings, top-level category first, most specific applicable subcategory last (see CATEGORY DISCIPLINE above),
 "project": short project/business-area label or null,
 "client": person or client name mentioned, or null,
 "importance": "high"|"medium"|"low",
 "planned": true|false (guess false unless entry implies it was scheduled in advance),
 "productivity": "productive"|"necessary"|"low-value"|"avoidable",
 "revenue": "revenue-generating"|"non-revenue",
 "followUpNeeded": true|false,
 "followUpDate": "YYYY-MM-DD" resolved from phrases like "tomorrow"/"next week" relative to the known date, or null if no follow-up or no date implied,
 "nextAction": short actionable suggestion or null,
 "startTime": "HH:MM" 24h if mentioned or inferable, else null,
 "endTime": "HH:MM" 24h if mentioned or inferable, else null,
 "durationMin": integer minutes if derivable, else null,
 "confidence": number 0-1,
 "uncertainFields": array of field-name strings (from: categoryPath, project, client, importance, productivity, revenue, followUpNeeded, followUpDate, startTime, endTime) that you are genuinely unsure about and a human should double-check
}`;
  return {sys, prompt};
}

async function analyseActivity(a){
  const matchedRule = findMatchingRule(a.originalInput);
  const {sys, prompt} = buildCategorizePrompt(a, matchedRule);
  try{
    const raw = await callClaude(prompt, sys);
    const parsed = JSON.parse(stripJsonFence(raw));
    applyAiResult(a, parsed, matchedRule);
    return true;
  }catch(e){
    console.error(e);
    const noKey = e && e.message==='NO_API_KEY';
    if(!noKey) logError('ai-categorize', 'AI categorisation failed for activity '+(a.id||'(new)'), e && e.message);
    // Keep the entry usable even with no AI: derive a plain title and leave the rest for manual edit.
    if(!a.title) a.title = (a.originalInput||'').split(/[.!?\n]/)[0].trim().slice(0,60) || 'Untitled activity';
    if(!a.durationMin && a.startTime && a.endTime){
      let d = timeToMinFromMidnight(a.endTime) - timeToMinFromMidnight(a.startTime);
      if(d<0) d+=1440;
      a.durationMin = d;
    }
    a.reviewFlags = ['categoryPath'];
    showToast(noKey
      ? 'Saved without AI sorting — add your AI key in Settings to switch it on.'
      : 'AI sorting unavailable — you can set the details yourself.');
    return false;
  }
}

function applyAiResult(a, parsed, matchedRule){
  let leafId;
  if(matchedRule){
    leafId = matchedRule.categoryId;
  } else {
    const path = Array.isArray(parsed.categoryPath) && parsed.categoryPath.length
      ? parsed.categoryPath
      : (parsed.category? [parsed.category] : []);
    leafId = resolveOrCreateCategoryPath(path, 'ai') || a.categoryId;
  }
  a.title = parsed.title || a.title;
  a.categoryId = leafId;
  a.project = parsed.project || null;
  // Keep the managed project list in sync so an AI-detected project is pickable next time.
  if(a.project) createProject(a.project);
  a.client = parsed.client || null;
  a.importance = parsed.importance || 'medium';
  a.planned = !!parsed.planned;
  a.productivity = parsed.productivity || 'necessary';
  a.revenue = parsed.revenue || 'non-revenue';
  a.followUpNeeded = !!parsed.followUpNeeded;
  a.followUpDate = parsed.followUpDate || null;
  a.nextAction = parsed.nextAction || null;
  if(!a.startTime && parsed.startTime) a.startTime = parsed.startTime;
  if(!a.endTime && parsed.endTime) a.endTime = parsed.endTime;
  if(parsed.durationMin) a.durationMin = parsed.durationMin;
  else if(a.startTime && a.endTime){
    let d = timeToMinFromMidnight(a.endTime) - timeToMinFromMidnight(a.startTime);
    if(d<0) d+=1440;
    a.durationMin = d;
  }
  a.confidence = parsed.confidence!=null? parsed.confidence : 0.6;
  a.reviewFlags = Array.isArray(parsed.uncertainFields) ? parsed.uncertainFields.map(f=>f==='category'?'categoryPath':f) : [];
  if(matchedRule) a.reviewFlags = a.reviewFlags.filter(f=>f!=='categoryPath'); // a saved rule is never "please review"
  a.aiOriginalClassification = a.aiOriginalClassification || JSON.parse(JSON.stringify({
    categoryId:a.categoryId, productivity:a.productivity, revenue:a.revenue, importance:a.importance
  }));
  a.classificationHistory = a.classificationHistory || [];
  a.classificationHistory.push({ts:Date.now(), source: matchedRule?'rule':'ai', categoryId:a.categoryId, productivity:a.productivity});
  a.updatedAt = Date.now();
}

function aiPeriodDates(scope){
  const today=todayStr();
  if(scope==='daily') return [today, today];
  if(scope==='weekly') return rangeDates('this_week');
  if(scope==='monthly') return rangeDates('this_month');
  if(scope==='custom') return [ui.aiCustomFrom||today, ui.aiCustomTo||today];
  return [today,today];
}
function aiPeriodKey(scope){
  const [from,to] = aiPeriodDates(scope);
  return scope+'-'+from+'_'+to;
}
function aiScopeLabel(scope){ return {daily:'Daily', weekly:'Weekly', monthly:'Monthly', custom:'Custom range'}[scope] || 'Daily'; }

// Deterministic, non-AI facts pulled straight from the recorded data — the "ground truth" layer.
function computeAnalysisFacts(from, to){
  const list = activitiesInDateRange(from,to);
  const [pfrom,pto] = previousPeriodDatesOf(from,to);
  const prevList = activitiesInDateRange(pfrom,pto);
  const totalMin = sumDuration(list);
  const prevTotalMin = sumDuration(prevList);

  const byCat={}; list.forEach(a=>{ byCat[a.categoryId]=(byCat[a.categoryId]||0)+(a.durationMin||0); });
  const catRows = Object.entries(byCat).map(([id,mins])=>({id,name:catShortBreadcrumb(id),mins,pct:pct(mins,totalMin)})).sort((a,b)=>b.mins-a.mins);

  const prevByCat={}; prevList.forEach(a=>{ prevByCat[a.categoryId]=(prevByCat[a.categoryId]||0)+(a.durationMin||0); });
  const neglected = Object.entries(prevByCat)
    .filter(([id,prevMins])=> prevMins>=30 && (byCat[id]||0) < prevMins*0.25)
    .map(([id,prevMins])=>({id,name:catShortBreadcrumb(id),prevMins,curMins:byCat[id]||0}))
    .sort((a,b)=>b.prevMins-a.prevMins).slice(0,4);

  const byProj={}; list.forEach(a=>{ if(a.project) byProj[a.project]=(byProj[a.project]||0)+(a.durationMin||0); });
  const projRows=Object.entries(byProj).map(([name,mins])=>({name,mins})).sort((a,b)=>b.mins-a.mins);

  const byClient={}; list.forEach(a=>{ if(a.client) byClient[a.client]=(byClient[a.client]||0)+(a.durationMin||0); });
  const clientRows=Object.entries(byClient).map(([name,mins])=>({name,mins})).sort((a,b)=>b.mins-a.mins);

  const revMin=sumDuration(list.filter(a=>a.revenue==='revenue-generating'));
  const adminMin=Math.max(0,totalMin-revMin);
  const valueMin=sumDuration(list.filter(a=>a.productivity==='productive'));
  const lowValueMin=sumDuration(list.filter(a=>a.productivity==='low-value'||a.productivity==='avoidable'));
  const topValueActivities = list.filter(a=>a.productivity==='productive'||a.revenue==='revenue-generating').sort((a,b)=>(b.durationMin||0)-(a.durationMin||0)).slice(0,5);

  const planned = plannedInDateRange(from,to);
  const plannedMin = sumDuration(planned);
  const adherencePct = plannedMin>0 ? Math.round((totalMin/plannedMin)*100) : null;

  const longer = planned
    .filter(p=>p.linkedActivityId)
    .map(p=>({p, a:state.activities.find(x=>x.id===p.linkedActivityId)}))
    .filter(x=>x.a && x.a.durationMin > x.p.durationMin*1.15+5);

  const groups={};
  list.forEach(a=>{
    const key=normName(a.title||''); if(!key) return;
    if(!groups[key]) groups[key]={title:a.title, mins:0, count:0};
    groups[key].mins+=(a.durationMin||0); groups[key].count+=1;
  });
  const repeated = Object.values(groups).filter(g=>g.count>=2).sort((a,b)=>b.mins-a.mins).slice(0,5);

  const topActivities = list.slice().sort((a,b)=>(b.durationMin||0)-(a.durationMin||0)).slice(0,5);
  const pendingFollowups = list.filter(a=>a.followUpNeeded);

  return {from,to,totalMin,prevTotalMin,catRows,neglected,projRows,clientRows,revMin,adminMin,valueMin,lowValueMin,
    topValueActivities,plannedMin,adherencePct,longer,repeated,topActivities,pendingFollowups,list};
}

function factsToLines(f){
  const lines=[];
  lines.push(`Total recorded time: ${minutesToHM(f.totalMin)} across ${f.list.length} activities (${f.from} to ${f.to}).`);
  if(f.catRows.length) lines.push(`Where time went: ${f.catRows.slice(0,4).map(c=>`${c.name} ${minutesToHM(c.mins)} (${c.pct}%)`).join(', ')}.`);
  lines.push(`Revenue-generating time: ${minutesToHM(f.revMin)} (${pct(f.revMin,f.totalMin)}%). Administrative/non-revenue time: ${minutesToHM(f.adminMin)} (${pct(f.adminMin,f.totalMin)}%).`);
  lines.push(`Productive time: ${minutesToHM(f.valueMin)}. Low-value/avoidable time: ${minutesToHM(f.lowValueMin)}.`);
  if(f.topValueActivities.length) lines.push(`Highest-value activities: ${f.topValueActivities.map(a=>`"${a.title||'untitled'}" (${minutesToHM(a.durationMin)})`).join(', ')}.`);
  if(f.adherencePct!=null) lines.push(`Planned schedule adherence: logged ${minutesToHM(f.totalMin)} of actual work against ${minutesToHM(f.plannedMin)} planned on the calendar (${f.adherencePct}%).`);
  else lines.push(`No activities were scheduled on the calendar for this period, so planned-vs-actual adherence can't be measured.`);
  if(f.longer.length) lines.push(`Ran longer than planned: ${f.longer.map(x=>`"${x.a.title||'untitled'}" (planned ${minutesToHM(x.p.durationMin)}, actual ${minutesToHM(x.a.durationMin)})`).join('; ')}.`);
  if(f.repeated.length) lines.push(`Tasks that repeated frequently: ${f.repeated.map(r=>`"${r.title}" ×${r.count} (${minutesToHM(r.mins)} total)`).join('; ')}.`);
  if(f.neglected.length) lines.push(`Categories that dropped off vs the prior equivalent period: ${f.neglected.map(n=>`${n.name} (was ${minutesToHM(n.prevMins)}, now ${minutesToHM(n.curMins)})`).join('; ')}.`);
  if(f.projRows.length) lines.push(`By project: ${f.projRows.slice(0,3).map(p=>`${p.name} ${minutesToHM(p.mins)}`).join(', ')}.`);
  if(f.clientRows.length) lines.push(`By client: ${f.clientRows.slice(0,3).map(c=>`${c.name} ${minutesToHM(c.mins)}`).join(', ')}.`);
  lines.push(`Pending follow-ups: ${f.pendingFollowups.length}${f.pendingFollowups.length? ' — '+f.pendingFollowups.slice(0,4).map(a=>`"${a.title||'untitled'}"`).join(', ')+(f.pendingFollowups.length>4?', …':''):''}.`);
  if(f.topActivities.length) lines.push(`Single longest activity: "${f.topActivities[0].title||'untitled'}" at ${minutesToHM(f.topActivities[0].durationMin)}.`);
  return lines;
}

function feedbackSummaryText(){
  const useful = state.recommendationFeedback.filter(f=>f.status==='useful').slice(-8).map(f=>f.text);
  const notUseful = state.recommendationFeedback.filter(f=>f.status==='not-useful').slice(-8).map(f=>f.text);
  const completed = state.recommendationFeedback.filter(f=>f.status==='completed').slice(-8).map(f=>f.text);
  const out=[];
  if(useful.length) out.push(`Previously marked USEFUL (lean into this style/subject): ${useful.join(' | ')}`);
  if(notUseful.length) out.push(`Previously marked NOT USEFUL (avoid repeating similar suggestions): ${notUseful.join(' | ')}`);
  if(completed.length) out.push(`Already COMPLETED previously (don't suggest again unless it's clearly recurring): ${completed.join(' | ')}`);
  return out.join('\n') || 'No prior feedback yet.';
}

function getFeedback(id){ return state.recommendationFeedback.find(f=>f.id===id) || null; }
function setFeedback(id, text, status){
  let f = getFeedback(id);
  if(!f){ f={id, text, status, createdAt:Date.now()}; state.recommendationFeedback.push(f); }
  else f.status = status;
  f.updatedAt = Date.now();
  if(status==='remind-later'){ const d=new Date(); d.setDate(d.getDate()+3); f.remindDate=d.toISOString().slice(0,10); }
  else f.remindDate=null;
  scheduleSave();
}

async function runAiAnalysis(scope){
  ui.aiLoading = true; render();
  const [from,to] = aiPeriodDates(scope);
  const key = scope+'-'+from+'_'+to;
  const facts = computeAnalysisFacts(from,to);

  if(facts.list.length===0){
    ui.aiResults[key] = {facts:['No recorded activities yet for this period — log a few entries and generate this again.'], interpretation:[], recommendations:[], generatedAt:Date.now()};
    ui.aiLoading=false; render(); return;
  }

  const factLines = factsToLines(facts);

  const sys = `You are Raheel's data-grounded productivity advisor. You are given FACTS already computed from his real logged activity data — treat them as ground truth and never invent additional numbers or activities not present in them. Your only job is to (1) interpret what these facts mean, and (2) propose specific, concrete recommendations.
Rules:
- Every recommendation must cite specific figures, activity names, category names, project names, or client names taken directly from the facts — never a vague generic statement like "manage your time better" or "be more productive".
- Follow this style: a specific fact-based comparison, then a specific instruction. Example: "You spent 3h20m on design changes this week but only 45m following up with ElevateBiz360 prospects. Complete sales follow-ups before starting more design work next week."
- Where the facts clearly support it, name specific activities or categories that could be delegated, and specific ones that could be automated — omit these rather than forcing a candidate if nothing fits.
- Do not repeat suggestions the user has already marked "not useful" or "completed" for a similar situation — see FEEDBACK HISTORY.
- interpretation: 3-5 short sentences. recommendations: 3-6 items, each one specific sentence.
Respond ONLY with valid JSON: {"interpretation": ["...", ...], "recommendations": ["...", ...]}`;

  const prompt = `FACTS for this ${aiScopeLabel(scope).toLowerCase()} analysis (${from} to ${to}):
${factLines.map(l=>'- '+l).join('\n')}

FEEDBACK HISTORY:
${feedbackSummaryText()}

Write the interpretation and recommendations JSON now.`;

  let interpretation=[], recommendations=[];
  try{
    const raw = await callClaude(prompt, sys);
    const parsed = JSON.parse(stripJsonFence(raw));
    interpretation = Array.isArray(parsed.interpretation) ? parsed.interpretation : [];
    recommendations = (Array.isArray(parsed.recommendations) ? parsed.recommendations : []).map(r=>({
      id: uid('rec'), text: typeof r==='string' ? r : (r.text||''),
    })).filter(r=>r.text);
  }catch(e){
    console.error(e);
    logError('ai-analysis', 'AI advisor call failed for '+key, e && e.message);
    interpretation = ['Analysis failed to generate this time — the facts below are still accurate; try generating again.'];
  }
  const record = {id:uid('analysis'), scope, from, to, facts:factLines, interpretation, recommendations, generatedAt:Date.now()};
  state.aiAnalysisHistory = state.aiAnalysisHistory || [];
  state.aiAnalysisHistory.push(record);
  if(state.aiAnalysisHistory.length>200) state.aiAnalysisHistory.splice(0, state.aiAnalysisHistory.length-200);
  scheduleSave();
  ui.aiResults[key] = record;
  ui.aiLoading = false;
  render();
}
function getLatestAnalysisForKey(key){
  const matches = (state.aiAnalysisHistory||[]).filter(r=>(r.scope+'-'+r.from+'_'+r.to)===key);
  if(!matches.length) return null;
  return matches.reduce((a,b)=> b.generatedAt>a.generatedAt? b:a);
}

// ---- Goals: natural-language -> measurable tracking rule ----
async function parseGoalText(text){
  const sys = `You convert a natural-language personal goal into a measurable tracking rule against Raheel's real activity log. Match categories/clients/projects to his EXISTING data where possible rather than inventing new ones. Respond ONLY with valid JSON, no commentary.`;
  const prompt = `Existing category tree:
${catTreeText()}

Known clients: ${distinctClients().join(', ')||'none yet'}
Known projects: ${distinctProjects().join(', ')||'none yet'}

Goal (verbatim): """${text}"""

Return JSON:
{
 "title": short label for this goal,
 "kind": "time" | "count",
 "direction": "at_least" | "at_most",
 "amount": number (hours if kind is "time", otherwise a plain count),
 "period": "week" | "weekday" | "day",
 "match": {
   "categoryPath": array of strings from the tree above, or null,
   "client": string or null,
   "project": string or null,
   "productivity": "productive"|"necessary"|"low-value"|"avoidable" or null,
   "titleKeyword": short keyword/phrase or null,
   "requiresFollowUp": true|false|null
 },
 "confidence": number 0-1
}
Use "weekday" only for goals explicitly about every workday (Mon-Fri) with a per-day target (e.g. "every weekday"). Use "week" for anything phrased "per week"/"every week"/unspecified. Only set match fields the goal text clearly implies; leave the rest null. Prefer categoryPath over titleKeyword when an existing category clearly fits.`;
  try{
    const raw = await callClaude(prompt, sys);
    return JSON.parse(stripJsonFence(raw));
  }catch(e){
    logError('goal-parse', 'Failed to parse goal text', e && e.message);
    return null;
  }
}
function goalFromParsed(rawText, parsed){
  const targetValue = parsed.kind==='time' ? Math.round((parsed.amount||0)*60) : Math.round(parsed.amount||0);
  return {
    id: uid('goal'), rawText, title: parsed.title || rawText,
    metric: {
      kind: parsed.kind==='count'?'count':'time',
      direction: parsed.direction==='at_most'?'at_most':'at_least',
      targetValue,
      period: parsed.period==='weekday'?'weekday':(parsed.period==='day'?'day':'week'),
    },
    match: parsed.match||{},
    createdAt: Date.now(), deletedAt:null, legacy:false, aiSuggested:false,
  };
}
async function createGoalFromText(text){
  if(!text || !text.trim()) return;
  ui.goalParsing = true; render();
  const parsed = await parseGoalText(text.trim());
  ui.goalParsing = false;
  if(!parsed){ showToast('Could not understand that goal — try rephrasing it.'); render(); return; }
  const goal = goalFromParsed(text.trim(), parsed);
  state.goals.push(goal);
  scheduleSave(); render();
  showToast('Tracking goal: '+goal.title);
}
async function convertLegacyGoal(id){
  const g = state.goals.find(x=>x.id===id);
  if(!g) return;
  ui.goalParsing = true; render();
  const parsed = await parseGoalText(g.rawText||g.title||'');
  ui.goalParsing = false;
  if(!parsed){ showToast('Could not parse that goal.'); render(); return; }
  const built = goalFromParsed(g.rawText||g.title, parsed);
  g.title = built.title; g.metric = built.metric; g.match = built.match; g.legacy = false;
  scheduleSave(); render();
  showToast('Goal converted — now tracked.');
}

// End-of-week explanation: achieved vs missed, why, and a concrete adjustment — grounded in real facts.
async function generateWeeklyGoalsReview(){
  const goals = activeGoalsStructured();
  if(goals.length===0){ showToast('Add a goal first.'); return; }
  ui.goalReviewLoading = true; render();
  const [from,to] = rangeDates('last_week');

    const weeklyTarget = goalWeeklyTarget(g);

    const value = g.metric.kind==='time'? sumDuration(matched) : matched.length;
    const achieved = g.metric.direction==='at_least'? value>=weeklyTarget : value<=weeklyTarget;
    const fmtVal = v=> g.metric.kind==='time'? minutesToHM(v) : v;
    lines.push(`"${g.title}" (${g.metric.direction==='at_least'?'target at least':'cap at most'} ${fmtVal(weeklyTarget)} per week): logged ${fmtVal(value)} — ${achieved?'ACHIEVED':'MISSED'}.`);
  });
  const facts = computeAnalysisFacts(from,to);
  const factLines = factsToLines(facts);

  const sys = `You are Raheel's goals coach. You're given his goal results for the past week (already computed — ground truth) plus general activity facts for that week. For each MISSED goal, give one specific, data-grounded reason it was likely missed (reference competing activities/categories by name from the facts) and one concrete adjustment for next week. For ACHIEVED goals, a short one-line acknowledgement is enough (reason/adjustment can be empty strings). Respond ONLY with JSON: {"summary":[{"goalTitle":"...", "status":"achieved"|"missed", "reason":"...", "adjustment":"..."}]}`;
  const prompt = `GOAL RESULTS for last week (${from} to ${to}):
${lines.map(l=>'- '+l).join('\n')}

GENERAL ACTIVITY FACTS for the same week:
${factLines.map(l=>'- '+l).join('\n')}

Write the JSON now.`;
  let summary=[];
  try{
    const raw = await callClaude(prompt, sys);
    const parsed = JSON.parse(stripJsonFence(raw));
    summary = Array.isArray(parsed.summary)? parsed.summary : [];
  }catch(e){
    logError('goal-review', 'Failed to generate weekly goals review', e && e.message);
  }
  const record = {id:uid('greview'), from, to, facts:lines, summary, generatedAt:Date.now()};
  state.goalReviewHistory = state.goalReviewHistory || [];
  state.goalReviewHistory.push(record);
  if(state.goalReviewHistory.length>100) state.goalReviewHistory.splice(0, state.goalReviewHistory.length-100);
  scheduleSave();
  ui.goalReviewLoading = false;
  ui.lastGoalReview = record;
  render();

function saveDraftActivity(draft, runAi){
  const isNew = !draft.id;
  const now = Date.now();
  const catBefore = draft.__catBefore;
  let a;
  if(isNew){
    a = Object.assign({}, draft, {
      id: uid('act'), createdAt: now, updatedAt: now, deletedAt:null,
      confidence:null, classificationHistory:[], editHistory:[], aiOriginalClassification:null, aiPending:false,
    });
    state.activities.unshift(a);
  } else {
    a = state.activities.find(x=>x.id===draft.id);
    const TRACKED_FIELDS = ['title','date','startTime','endTime','durationMin','categoryId','project','client','importance','planned','productivity','revenue','followUpNeeded','followUpDate','nextAction'];
    const before = {}; TRACKED_FIELDS.forEach(k=>{ before[k]=a[k]; });
    const lockedOriginalInput = a.originalInput; // never overwritten on edit — see ARCHITECTURE note above
    Object.assign(a, draft, {updatedAt:now});
    a.originalInput = lockedOriginalInput;
    const changedFields = TRACKED_FIELDS.filter(k=> JSON.stringify(before[k])!==JSON.stringify(a[k]));
    if(changedFields.length){
      a.editHistory = a.editHistory || [];
      a.editHistory.push({ts:now, source:'manual', changedFields, before: changedFields.reduce((o,k)=>{o[k]=before[k]; return o;},{})});
    }
  }
  delete a.__catBefore;
  const linkPlannedId = draft.__linkPlannedId;
  delete a.__linkPlannedId;
  if(linkPlannedId) linkPlannedToActivity(linkPlannedId, a.id);
  const categoryManuallyChanged = catBefore!==undefined && catBefore!==a.categoryId;

function goalMatchesActivity(goal, a){
  const m = goal.match || {};
  if(m.categoryPath && m.categoryPath.length){
    const chain = catBreadcrumbArr(a.categoryId).map(s=>s.toLowerCase());
    const path = m.categoryPath.map(s=>s.toLowerCase());
    if(!path.every((seg,i)=>chain[i]===seg)) return false;
  }
  if(m.client && (a.client||'').toLowerCase()!==m.client.toLowerCase()) return false;
  if(m.project && (a.project||'').toLowerCase()!==m.project.toLowerCase()) return false;
  if(m.productivity && a.productivity!==m.productivity) return false;
  if(m.requiresFollowUp!=null && !!a.followUpNeeded!==!!m.requiresFollowUp) return false;
  if(m.titleKeyword){
    const kw=m.titleKeyword.toLowerCase();
    const hay=((a.title||'')+' '+(a.originalInput||'')).toLowerCase();
    if(!hay.includes(kw)) return false;
  }
  return true;
}
function isWeekdayDate(ds){ const d=new Date(ds+'T00:00:00'); const day=d.getDay(); return day>=1 && day<=5; }
// A goal's target expressed per week, so per-day and per-weekday goals can be compared on a weekly chart.
function goalWeeklyTarget(goal){
  const p = goal.metric.period;
  if(p==='weekday') return goal.metric.targetValue*5;
  if(p==='day') return goal.metric.targetValue*7;
  return goal.metric.targetValue;
}
function goalPeriodDates(goal){
  if(goal.metric.period==='week') return rangeDates('this_week');
  return [todayStr(), todayStr()];
}
function computeGoalProgress(goal){
  const [from,to] = goalPeriodDates(goal);
  const noTargetToday = goal.metric.period==='weekday' && !isWeekdayDate(todayStr());
  const matched = activitiesInDateRange(from,to).filter(a=>goalMatchesActivity(goal,a));
  const current = goal.metric.kind==='time' ? sumDuration(matched) : matched.length;
  const target = goal.metric.targetValue;
  const atLeast = goal.metric.direction==='at_least';
  const remaining = atLeast ? Math.max(0,target-current) : Math.max(0,current-target);
  const met = atLeast ? current>=target : current<=target;

  let daysLeft=0;
  if(goal.metric.period==='week'){ const dayIdx=(new Date().getDay()+6)%7; daysLeft = 6-dayIdx; }

  let paceStatus;
  if(goal.metric.period==='week'){
    const dayIdx=(new Date().getDay()+6)%7;
    const fracPassed=(dayIdx+1)/7;
    if(atLeast) paceStatus = met? 'achieved-so-far' : (current>=target*fracPassed? 'on-track':'behind');
    else paceStatus = current<=target? 'on-track':'exceeded';
  } else {
    paceStatus = met? 'met-today' : (noTargetToday? 'no-target-today':'not-yet-today');
  }
  return {from,to,current,target,remaining,met,daysLeft,paceStatus,noTargetToday,matchedCount:matched.length};
}
function goalWeeklyTrend(goal, weeksBack){
  weeksBack = weeksBack||6;
  const today=new Date();
  const curDay=(today.getDay()+6)%7;
  const thisMonday=new Date(today); thisMonday.setDate(today.getDate()-curDay);
  const weeklyTarget = goalWeeklyTarget(goal);
  const weeks=[];
  for(let i=weeksBack-1;i>=0;i--){
    const mon=new Date(thisMonday); mon.setDate(thisMonday.getDate()-i*7);
    const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    const from=mon.toISOString().slice(0,10), to=sun.toISOString().slice(0,10);
    const matched = activitiesInDateRange(from,to).filter(a=>goalMatchesActivity(goal,a));
    const value = goal.metric.kind==='time'? sumDuration(matched) : matched.length;
    const achieved = goal.metric.direction==='at_least'? value>=weeklyTarget : value<=weeklyTarget;
    weeks.push({from,to,value,achieved,label:mon.toLocaleDateString('en-GB',{day:'numeric',month:'short'}),isCurrent:i===0});
  }
  return weeks;
}
function activitiesForDate(d){ return activeActivities().filter(a=>a.date===d); }
function catById(id){ return state.categories.find(c=>c.id===id); }
function catColor(id){ return (catById(id)||{}).color || '#8a7d73'; }
function catName(id){ return (catById(id)||{}).name || 'Uncategorised'; }

function catChildren(parentId, includeArchived){
  return state.categories.filter(c=>c.parentId===parentId && (includeArchived || !c.archived));
}
function catTopLevel(includeArchived){ return catChildren(null, includeArchived); }

// Full chain of names from root to this node, e.g. ["ElevateBiz360","Marketing","Social Media"]
function catBreadcrumbArr(id){
  const chain=[]; let cur=catById(id); let guard=0;
  while(cur && guard++<8){ chain.unshift(cur.name); cur = cur.parentId? catById(cur.parentId) : null; }
  return chain;
}
function catBreadcrumbStr(id){ return catBreadcrumbArr(id).join(' → ') || 'Uncategorised'; }
function catShortBreadcrumb(id){ const arr=catBreadcrumbArr(id); return arr.slice(-2).join(' · ') || 'Uncategorised'; }

// Indented text tree of all active categories, used to give the AI full existing structure so it reuses
// rather than duplicates (e.g. it should see Marketing already has a Social Media child).
function catTreeText(){
  const lines=[];
  function walk(parentId, depth){
    catChildren(parentId, false).forEach(c=>{
      lines.push('  '.repeat(depth) + '- ' + c.name);
      walk(c.id, depth+1);
    });
  }
  walk(null, 0);
  return lines.join('\n') || '(no categories yet)';
}

// Flattened list for <select> dropdowns: [{id, label(with indentation), depth}]
function catFlattenForSelect(includeArchived){
  const out=[];
  function walk(parentId, depth){
    catChildren(parentId, includeArchived).forEach(c=>{
      out.push({id:c.id, label:(depth? '\u2014 '.repeat(depth):'') + c.name, depth, archived:c.archived});
      walk(c.id, depth+1);
    });
  }
  walk(null, 0);
  return out;
}

function normName(n){ return (n||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }

// Case/punctuation-insensitive match against siblings, so the AI (or user) re-using slightly different
// wording for something that already exists ("Social Posts" vs "Social Media") still lands on one node
// once it's been created — exact-name dedup is enforced here; the *conceptual* dedup (deciding these
// phrases mean the same thing) is asked of the AI itself via the full tree in the prompt.
function findSiblingByName(name, parentId){
  const n = normName(name);
  return state.categories.find(c=>c.parentId===parentId && !c.archived && normName(c.name)===n);
}

// Options for a category <select> bound to a record. Always includes the record's CURRENT category
// even when it has been archived — otherwise the browser would fall back to the first option and
// silently recategorise the record on save.
function catSelectOptionsHtml(selectedId){
  const list = catFlattenForSelect(false);
  if(selectedId && !list.some(c=>c.id===selectedId)){
    const c = catById(selectedId);
    if(c) list.unshift({id:c.id, label:c.name+' (archived)', depth:0, archived:true});
  }
  return list.map(c=>`<option value="${c.id}" ${c.id===selectedId?'selected':''}>${escapeHtml(c.label)}</option>`).join('');
}

const CAT_PALETTE = ['#691D1F','#B78844','#4f7a5a','#3d6b8f','#8a5a2b','#7d6b8f','#a08a4a','#c77b45','#5c5c8a','#b4658a','#3f9e7a','#4a7fb5'];
function nextPaletteColor(){ return CAT_PALETTE[state.categories.length % CAT_PALETTE.length]; }

function addCategoryHistory(cat, action, detail){
  cat.history = cat.history || [];
  cat.history.push({ts:Date.now(), action, detail:detail||''});
}

function createCategoryNode(name, parentId, opts){
  opts = opts||{};
  const existing = findSiblingByName(name, parentId||null);
  if(existing) return existing;
  const c = {
    id: uid('cat'), name: name.trim(), parentId: parentId||null,
    color: opts.color || (parentId? catColor(parentId) : nextPaletteColor()),
    archived:false, mergedInto:null,
    history:[{ts:Date.now(), action:'created', detail:opts.source||'manual'}],
  };
  state.categories.push(c);
  return c;
}

// Resolves a path like ["ElevateBiz360","Marketing","Social Media"] to a leaf category id, creating any
// missing nodes along the way (nesting new ones under the right parent instead of as new top-level
// categories). Existing nodes are matched case/punctuation-insensitively so near-identical AI wording
// reuses the same node rather than spawning a duplicate.
function resolveOrCreateCategoryPath(pathArr, source){
  if(!pathArr || !pathArr.length) return null;
  let parentId = null;
  let node = null;
  pathArr.forEach(rawName=>{
    const name = (rawName||'').trim();
    if(!name) return;
    let existing = findSiblingByName(name, parentId);
    if(!existing){
      existing = createCategoryNode(name, parentId, {source: source||'ai'});
    }
    node = existing;
    parentId = existing.id;
  });
  return node ? node.id : null;
}

function renameCategory(id, newName){
  const c = catById(id); if(!c || !newName || !newName.trim()) return;
  const old = c.name;

  scheduleSave();
}
function recolorCategory(id, color){

function archiveCategory(id){
  const c = catById(id); if(!c) return;
  c.archived = true;
  addCategoryHistory(c, 'archived', '');
  // archive descendants too so they don't dangle as selectable orphans
  catChildren(id, true).forEach(ch=>archiveCategory(ch.id));
  scheduleSave();
}
function restoreCategory(id){

function moveActivitiesCategory(sourceId, targetId, reason){
  if(sourceId===targetId) return 0;
  let n=0;
  state.activities.forEach(a=>{
    if(a.categoryId===sourceId){
      a.categoryId = targetId;
      a.classificationHistory = a.classificationHistory||[];
      a.classificationHistory.push({ts:Date.now(), source:reason||'manual-move', categoryId:targetId});
      a.updatedAt = Date.now();
      n++;
    }
  });
  return n;
}
function mergeCategories(sourceId, targetId){
  if(sourceId===targetId) return;
  const src = catById(sourceId), tgt = catById(targetId);
  if(!src || !tgt) return;
  const moved = moveActivitiesCategory(sourceId, targetId, 'merged');
  // re-parent any children of the source under the target instead of leaving them attached to an archived node
  catChildren(sourceId, true).forEach(ch=>{ ch.parentId = targetId; addCategoryHistory(ch, 'reparented', `now under ${tgt.name} (parent merged)`); });
  src.archived = true;
  src.mergedInto = targetId;
  addCategoryHistory(src, 'merged', `into "${tgt.name}" (${moved} activities moved)`);
  addCategoryHistory(tgt, 'merge-received', `absorbed "${src.name}" (${moved} activities)`);
  scheduleSave();
}

function minToTimeStr(min){
  min = ((min%1440)+1440)%1440;
  return pad2(Math.floor(min/60))+':'+pad2(Math.round(min%60));
}
function addMinutesToTime(time, deltaMin){

}
function snapMinutes(min, step){ step=step||5; return Math.round(min/step)*step; }
function nowMinutesOfDay(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

// Status is derived, never stored, so it's always accurate against the clock.
function plannedStatus(p){
  if(p.linkedActivityId){
    const linked = state.activities.find(a=>a.id===p.linkedActivityId && !a.deletedAt);
    if(linked) return 'completed';
  }
  const isToday = p.date===todayStr();

  const nowMin = nowMinutesOfDay();
  const isPast = p.date < todayStr() || (isToday && endMin!=null && nowMin>endMin);
  if(isPast) return 'missed';
  if(isToday && startMin!=null && endMin!=null && nowMin>=startMin && nowMin<=endMin) return 'due-now';
  return 'upcoming';
}

// Generates concrete future instances for a recurring plan (daily or weekly-on-days) up to a horizon,
// rather than an abstract "template" — simpler to display, edit and drag per-instance.
function generateRecurringInstances(base, recurrence, horizonDays){
  horizonDays = horizonDays || 60;
  const seriesId = uid('series');
  const created = [];
  const startDate = new Date(base.date+'T00:00:00');
  for(let i=0;i<=horizonDays;i++){
    const d = new Date(startDate); d.setDate(startDate.getDate()+i);
    if(recurrence.until && d.toISOString().slice(0,10) > recurrence.until) break;
    let include = false;
    if(recurrence.freq==='daily') include = true;
    else if(recurrence.freq==='weekly'){
      const dow = (d.getDay()+6)%7; // 0=Mon
      include = (recurrence.daysOfWeek||[]).includes(dow);
    }
    if(!include) continue;
    const ds = d.toISOString().slice(0,10);
    const p = createPlannedActivity(Object.assign({}, base, {
      date:ds, seriesId, linkedActivityId: (ds===base.date? base.linkedActivityId||null : null),
    }));
    created.push(p);
  }
  return {seriesId, count:created.length};
}

// Turns a logged (actual) activity into a recurring plan going forward — captures its time-of-day,
// duration, category, project and client as the template for future scheduled instances.
function convertActivityToRecurring(activityId, recurrence, horizonDays){
  const a = state.activities.find(x=>x.id===activityId);
  if(!a) return null;
  const base = {
    title:a.title, date:a.date, startTime:a.startTime||'09:00', endTime:a.endTime||'10:00',
    categoryId:a.categoryId, project:a.project, client:a.client, importance:a.importance,
    linkedActivityId:a.id,
  };
  const result = generateRecurringInstances(base, recurrence, horizonDays);
  scheduleSave();
  return result;
}

// The core planned-vs-actual reconciliation for a single day.
function computeDailyComparison(ds){
  const planned = plannedForDate(ds);
  const actual = activitiesForDate(ds);
  const plannedMin = sumDuration(planned);
  const actualMin = sumDuration(actual);
  const unplannedMin = sumDuration(actual.filter(a=>!a.planned));
  const missed = planned.filter(p=>plannedStatus(p)==='missed');
  const missedPriorities = missed.filter(p=>p.importance==='high');
  const longerThanExpected = planned
    .filter(p=>p.linkedActivityId)
    .map(p=>({planned:p, actual: state.activities.find(a=>a.id===p.linkedActivityId && !a.deletedAt)}))
    .filter(x=> x.actual && x.actual.durationMin>0 && x.planned.durationMin>0
                && x.actual.durationMin > x.planned.durationMin*1.15 + 5);
  return {
    plannedMin, actualMin, diffMin: actualMin-plannedMin,
    missedCount: missed.length, missedPriorities,
    unplannedMin, longerThanExpected,
  };
}

function rangeDates(range){
  const today = new Date();
  const toStr = d=>d.toISOString().slice(0,10);
  if(range==='today') return [toStr(today), toStr(today)];
  if(range==='yesterday'){ const y=new Date(today); y.setDate(y.getDate()-1); return [toStr(y), toStr(y)]; }
  if(range==='this_week'){ const day=(today.getDay()+6)%7; const mon=new Date(today); mon.setDate(today.getDate()-day); return [toStr(mon), toStr(today)]; }
  if(range==='last_week'){ const day=(today.getDay()+6)%7; const mon=new Date(today); mon.setDate(today.getDate()-day-7); const sun=new Date(mon); sun.setDate(mon.getDate()+6); return [toStr(mon), toStr(sun)]; }
  if(range==='this_month'){ const first=new Date(today.getFullYear(), today.getMonth(),1); return [toStr(first), toStr(today)]; }
  if(range==='last_month'){ const first=new Date(today.getFullYear(), today.getMonth()-1,1); const last=new Date(today.getFullYear(), today.getMonth(),0); return [toStr(first), toStr(last)]; }
  if(range==='custom') return [ui.chartsCustomFrom||toStr(today), ui.chartsCustomTo||toStr(today)];
  return [toStr(today), toStr(today)];
}
function activitiesInDateRange(from, to){ return activeActivities().filter(a=>a.date>=from && a.date<=to); }
function plannedInDateRange(from, to){ return activePlanned().filter(p=>p.date>=from && p.date<=to); }
function activitiesInRange(range){
  const [from,to] = rangeDates(range);
  return activitiesInDateRange(from,to);
}
// The window immediately preceding the current range, same length — used for "vs last period" comparisons.
function previousPeriodDatesOf(from,to){
  const fromD=new Date(from+'T00:00:00'), toD=new Date(to+'T00:00:00');
  const spanDays = Math.round((toD-fromD)/86400000)+1;
  const prevTo = new Date(fromD); prevTo.setDate(fromD.getDate()-1);
  const prevFrom = new Date(prevTo); prevFrom.setDate(prevTo.getDate()-spanDays+1);
  const toStr=d=>d.toISOString().slice(0,10);
  return [toStr(prevFrom), toStr(prevTo)];
}
function previousRangeDates(range){
  const [from,to] = rangeDates(range);
  return previousPeriodDatesOf(from,to);
}
const RANGE_LABELS = {today:'today', yesterday:'yesterday', this_week:'this week', last_week:'last week', this_month:'this month', last_month:'last month', custom:'this period'};
function rangeLabel(range){ return RANGE_LABELS[range] || 'this period'; }
function previousRangeLabel(range){
  return {today:'yesterday', yesterday:'the day before', this_week:'last week', last_week:'the week before', this_month:'last month', last_month:'the month before', custom:'the previous period'}[range] || 'the previous period';
}
function pct(part, whole){ return whole>0 ? Math.round((part/whole)*100) : 0; }
function ppDelta(curPct, prevPct){
  const d = curPct - prevPct;
  if(Math.abs(d)<1) return 'about the same as';
  return (d>0? `${d}pp higher than` : `${Math.abs(d)}pp lower than`);
}

// Snapshot anything the user has typed (plus focus + caret) so a background re-render — from the
// running-timer tick or the once-a-minute clock tick — never destroys in-progress input.
function snapshotInputs(root){
  const vals = {};
  root.querySelectorAll('input, textarea, select').forEach(el=>{
    if(!el.id) return;
    if(el.type==='file') return;
    vals[el.id] = el.value;
  });
  const active = document.activeElement;
  let focus = null;
  if(active && active.id && root.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)){
    focus = {id:active.id};
    try{ focus.start = active.selectionStart; focus.end = active.selectionEnd; }catch(e){}
  }
  return {vals, focus};
}
function restoreInputs(root, snap){
  if(!snap) return;
  Object.keys(snap.vals).forEach(id=>{
    const typed = snap.vals[id];
    if(!typed) return;
    const el = document.getElementById(id);
    if(!el || el.type==='file') return;
    // Only refill fields the re-render left blank. Controls that derive their value from app state
    // (date pickers, category dropdowns, filters) come back already populated and must NOT be
    // reverted to a stale snapshot — that would undo actions like tapping "Today".
    if(el.value==='') el.value = typed;
  });
  if(snap.focus){
    const el = document.getElementById(snap.focus.id);
    if(el){
      el.focus();
      if(snap.focus.start!=null){ try{ el.setSelectionRange(snap.focus.start, snap.focus.end); }catch(e){} }
    }
  }
}

function render(){
  const root = document.getElementById('rti-root');
  // Never re-render mid drag/resize — it would rip the element out from under the pointer.
  if(dragCtx) return;
  if(!state.onboardingSeen){
    root.innerHTML = renderOnboarding();
    bindOnboardingEvents();
    return;
  }
  const snap = snapshotInputs(root);
  root.innerHTML = `

// ---------- Today ----------
function renderToday(){
  const todays = activitiesForDate(todayStr());
  const total = sumDuration(todays);
  const remaining = Math.max(0, 24*60 - total);
  const byCat = {};
  todays.forEach(a=>{ byCat[a.categoryId]=(byCat[a.categoryId]||0)+(a.durationMin||0); });
  const topCatId = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a])[0];
  const productive = sumDuration(todays.filter(a=>a.productivity==='productive'));
  const avoidable = sumDuration(todays.filter(a=>a.productivity==='avoidable'));
  const revenue = sumDuration(todays.filter(a=>a.revenue==='revenue-generating'));
  const pendingFollowups = todays.filter(a=>a.followUpNeeded).length;

  let timerBlock = '';
  if(ui.timer.running){
    const secs = Math.floor((Date.now()-ui.timer.startedAt)/1000);
    const h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
    timerBlock = `
      <div class="rti-timerlive">
        <span class="rti-pulse"></span>
        <span>Timer running</span>
        <span class="t rti-serif">${pad2(h)}:${pad2(m)}:${pad2(s)}</span>
        <button class="rti-btn rti-btn-gold" style="margin-left:auto" data-action="stop-timer">Stop &amp; Log</button>
      </div>`;
  }

  return `
    ${timerBlock}
    <div class="rti-bigbox">
      <label class="rti-serif">What did you do?</label>
      <textarea id="rti-quickinput" placeholder="e.g. Had a meeting with a RAKBANK client from 10:00 to 11:00 regarding an Elite account. Documents pending."></textarea>
      <div class="rti-row">
        <button class="rti-btn rti-btn-gold" data-action="quick-save" style="flex:1;justify-content:center;font-size:15px;padding:13px">Save</button>
      </div>
      ${!ui.timer.running? `<div style="text-align:center;margin-top:10px"><button class="rti-btn rti-btn-ghost" data-action="start-timer" style="padding:5px 10px;font-size:12px">⏱ Or start a timer instead</button></div>`:''}
    </div>

    <div class="rti-grid">
      <div class="rti-stat"><div class="num">${minutesToHM(total)}</div><div class="lbl">Recorded today</div></div>
      <div class="rti-stat"><div class="num">${minutesToHM(remaining)}</div><div class="lbl">Unrecorded</div></div>
      <div class="rti-stat"><div class="num" style="color:${catColor(topCatId)}">${topCatId? catName(topCatId):'—'}</div><div class="lbl">Top category</div></div>
      <div class="rti-stat"><div class="num">${todays.length}</div><div class="lbl">Activities logged</div></div>
      <div class="rti-stat"><div class="num" style="color:var(--ok-green)">${minutesToHM(productive)}</div><div class="lbl">Productive time</div></div>
      <div class="rti-stat"><div class="num" style="color:var(--bad-red)">${minutesToHM(avoidable)}</div><div class="lbl">Avoidable time</div></div>
      <div class="rti-stat"><div class="num" style="color:var(--gold-600)">${minutesToHM(revenue)}</div><div class="lbl">Revenue-generating</div></div>
      <div class="rti-stat"><div class="num">${pendingFollowups}</div><div class="lbl">Follow-ups pending</div></div>
    </div>

    <div class="rti-card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0">Today's timeline</h3>
        <button class="rti-btn rti-btn-ghost" data-action="goto-ai-daily">✦ AI summary of today</button>
      </div>
      ${todays.length===0? emptyState('No activities logged yet today.') : todays.slice().sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||'')).map(activityRow).join('')}

// ---------- Calendar ----------
// ---- Managed projects -------------------------------------------------------------
// Activities keep storing the project NAME (so charts, goals, export and import all keep
// working unchanged); this list just makes the names pickable and manageable.
function activeProjects(){ return (state.projects||[]).filter(p=>!p.deletedAt); }
function projectByName(name){
  const n=(name||'').trim().toLowerCase();
  return (state.projects||[]).find(p=>p.name.trim().toLowerCase()===n);
}
function createProject(name){
  const n=(name||'').trim();
  if(!n) return null;
  const existing = projectByName(n);
  if(existing){ if(existing.deletedAt){ existing.deletedAt=null; } return existing; }
  const p={id:uid('proj'), name:n, createdAt:Date.now(), deletedAt:null, history:[{ts:Date.now(),action:'created',detail:'manual'}]};
  state.projects.push(p);
  return p;
}
function renameProject(id, newName){
  const p=(state.projects||[]).find(x=>x.id===id);
  const n=(newName||'').trim();
  if(!p || !n || n===p.name) return 0;
  const old=p.name;
  let moved=0;
  state.activities.forEach(a=>{ if(a.project===old){ a.project=n; a.updatedAt=Date.now(); moved++; } });
  state.plannedActivities.forEach(x=>{ if(x.project===old){ x.project=n; x.updatedAt=Date.now(); } });
  p.name=n;
  p.history=p.history||[];
  p.history.push({ts:Date.now(), action:'renamed', detail:`${old} → ${n} (${moved} activities updated)`});
  scheduleSave();
  return moved;
}
function deleteProject(id){
  const p=(state.projects||[]).find(x=>x.id===id);
  if(!p) return;
  p.deletedAt=Date.now();
  p.history=p.history||[];
  p.history.push({ts:Date.now(), action:'removed', detail:'hidden from picker; existing activities keep their label'});
  scheduleSave();
}
function projectUsageCount(name){
  return activeActivities().filter(a=>a.project===name).length;
}
// Like the category picker: always include the record's current value even if that project was
// removed from the list, so saving can never silently blank or change it.
function projectSelectOptionsHtml(selectedName){
  const names = activeProjects().map(p=>p.name);
  const sel=(selectedName||'').trim();
  if(sel && !names.some(n=>n.toLowerCase()===sel.toLowerCase())) names.unshift(sel);
  return `<option value="">— none —</option>` + names.sort((a,b)=>a.localeCompare(b))
    .map(n=>`<option value="${escapeHtml(n)}" ${n===sel?'selected':''}>${escapeHtml(n)}</option>`).join('');
}

function distinctProjects(){
  const set=new Set(activeProjects().map(p=>p.name));
  activeActivities().forEach(a=>{ if(a.project) set.add(a.project); });
  activePlanned().forEach(p=>{ if(p.project) set.add(p.project); });
  return Array.from(set).sort();
}
function distinctClients(){
  const set=new Set();
  activeActivities().forEach(a=>{ if(a.client) set.add(a.client); });
  activePlanned().forEach(p=>{ if(p.client) set.add(p.client); });
  return Array.from(set).sort();
}
function filterMatch(entity){
  if(ui.filter.category!=='all' && entity.categoryId!==ui.filter.category) return false;
  if(ui.filter.project!=='all' && (entity.project||'')!==ui.filter.project) return false;
  if(ui.filter.client!=='all' && (entity.client||'')!==ui.filter.client) return false;
  return true;
}

function renderCalendar(){

function weekDates(ds){
  const d=new Date(ds+'T00:00:00');
  const day=(d.getDay()+6)%7;
  const monday=new Date(d); monday.setDate(d.getDate()-day);
  const out=[];
  for(let i=0;i<7;i++){ const dt=new Date(monday); dt.setDate(monday.getDate()+i); out.push(dt.toISOString().slice(0,10)); }
  return out;
}

function renderDailyComparisonCard(ds){
  const c = computeDailyComparison(ds);
  return `<div class="rti-card">
    <h3>${fmtDateLong(ds)} — plan vs actual</h3>

      <div class="rti-stat"><div class="num">${minutesToHM(c.plannedMin)}</div><div class="lbl">Planned</div></div>
      <div class="rti-stat"><div class="num">${minutesToHM(c.actualMin)}</div><div class="lbl">Actual recorded</div></div>
      <div class="rti-stat"><div class="num" style="color:${c.diffMin>=0?'var(--ok-green)':'var(--bad-red)'}">${c.diffMin>=0?'+':'−'}${minutesToHM(Math.abs(c.diffMin))}</div><div class="lbl">Difference</div></div>
      <div class="rti-stat"><div class="num" style="color:var(--bad-red)">${c.missedCount}</div><div class="lbl">Missed planned</div></div>
      <div class="rti-stat"><div class="num" style="color:var(--warn-amber)">${minutesToHM(c.unplannedMin)}</div><div class="lbl">Unplanned work</div></div>
      <div class="rti-stat"><div class="num">${c.longerThanExpected.length}</div><div class="lbl">Ran over time</div></div>
    </div>

    ${c.longerThanExpected.length? `<div style="margin-top:6px;font-size:12.5px;color:var(--warn-amber)">Ran over: ${c.longerThanExpected.map(x=>escapeHtml(x.planned.title||'untitled')+' ('+minutesToHM(x.planned.durationMin)+' → '+minutesToHM(x.actual.durationMin)+')').join(', ')}</div>`:''}
  </div>`;
}

// The grid defaults to a working-day window, but must always cover whatever is actually on
// screen — otherwise an early-morning or late-night item renders outside the grid and can't be
// tapped. Expands (never shrinks below the default) to fit the earliest start and latest end.
function computeGridWindow(dates){
  let minMin = 6*60, maxMin = 22*60;
  dates.forEach(ds=>{
    const items = plannedForDate(ds).filter(filterMatch).concat(activitiesForDate(ds).filter(filterMatch));
    items.forEach(it=>{
      const s = timeToMinFromMidnight(it.startTime);
      if(s==null) return;
      const e = s + (it.durationMin || 30);
      if(s < minMin) minMin = s;
      if(e > maxMin) maxMin = e;
    });
  });
  const startH = Math.max(0, Math.floor(minMin/60));
  const endH   = Math.min(24, Math.ceil(maxMin/60));
  return {startH, endH: Math.max(endH, startH+1)};
}

function renderTimeGridCard(dates){
  // Set the window on ui so the day columns and the tap-empty-slot handler all agree.
  const win = computeGridWindow(dates);
  ui.gridStartHour = win.startH;
  ui.gridEndHour = win.endH;
  const startH=ui.gridStartHour, endH=ui.gridEndHour, pxm=ui.pxPerMin;
  const totalHeight=(endH-startH)*60*pxm;
  let timeLabels='';
  for(let h=startH; h<=endH; h++) timeLabels += `<div class="lbl" style="top:${(h-startH)*60*pxm}px">${pad2(h)}:00</div>`;
  const cols = dates.map(ds=>renderDayColumn(ds, win)).join('');
  return `<div class="rti-card">
    <div class="cal-grid-scroll">
      <div class="cal-grid">
        <div class="cal-timecol"><div class="cal-colheader" style="visibility:hidden">00</div><div style="position:relative;height:${totalHeight}px">${timeLabels}</div></div>
        ${cols}
      </div>
    </div>
  </div>`;
}

function renderDayColumn(ds, win){
  // Fall back to computing the window for this day alone, so this is safe to call on its own.
  const w = win || computeGridWindow([ds]);
  const startH=w.startH, endH=w.endH, pxm=ui.pxPerMin;
  const totalHeight=(endH-startH)*60*pxm;
  const isToday = ds===todayStr();
  const dObj = new Date(ds+'T00:00:00');
  const label = dObj.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

  let hourlines='';
  for(let h=startH; h<=endH; h++) hourlines += `<div class="cal-hourline" style="top:${(h-startH)*60*pxm}px"></div>`;

  const planned = plannedForDate(ds).filter(filterMatch);
  const actual = activitiesForDate(ds).filter(filterMatch);

  const plannedHtml = planned.map(p=>{
    const top=(timeToMinFromMidnight(p.startTime||'00:00')-startH*60)*pxm;
    const height=Math.max(20,(p.durationMin||30)*pxm);
    const color=catColor(p.categoryId);
    const status=plannedStatus(p);
    const meta=PLANNED_STATUS_META[status];
    return `<div class="cal-block-planned" data-drag-kind="planned" data-drag-id="${p.id}" style="top:${top}px;height:${height}px;border:2px dashed ${color};opacity:${status==='missed'?0.55:1}">
      <div class="cal-block-inner" style="color:${color}">
        <b>${escapeHtml(p.title||'(untitled)')}</b>
        <span>${p.startTime}–${p.endTime} · ${meta.label}</span>
      </div>
      <div class="cal-resize-handle" data-drag-kind="planned" data-drag-id="${p.id}"></div>
    </div>`;
  }).join('');

  const actualHtml = actual.map(a=>{
    const top=(timeToMinFromMidnight(a.startTime||'00:00')-startH*60)*pxm;
    const height=Math.max(20,(a.durationMin||30)*pxm);
    const color=catColor(a.categoryId);
    return `<div class="cal-block-actual" data-drag-kind="actual" data-drag-id="${a.id}" style="top:${top}px;height:${height}px;background:${color}">
      <div class="cal-block-inner">
        <b>${escapeHtml(a.title||'(untitled)')}</b>
        <span>${a.startTime||'--'}–${a.endTime||'--'}${a.planned? '' : ' · unplanned'}</span>
      </div>
      <div class="cal-resize-handle" data-drag-kind="actual" data-drag-id="${a.id}"></div>
    </div>`;
  }).join('');

  let runningHtml='';
  if(isToday && ui.timer.running){
    const st=new Date(ui.timer.startedAt);
    const startMin=st.getHours()*60+st.getMinutes();
    const nowMin=nowMinutesOfDay();
    const top=(startMin-startH*60)*pxm;
    const height=Math.max(14,(nowMin-startMin)*pxm);
    runningHtml = `<div class="cal-running-block" style="top:${top}px;height:${height}px"><div class="cal-block-inner"><b>⏱ Running…</b></div></div>`;
  }

  let nowLineHtml='';
  if(isToday){
    const nowMin=nowMinutesOfDay();
    if(nowMin>=startH*60 && nowMin<=endH*60){
      nowLineHtml = `<div class="cal-now-line" style="top:${(nowMin-startH*60)*pxm}px"><span class="cal-now-dot"></span></div>`;
    }
  }

  return `<div class="cal-col" data-col-date="${ds}">
    <div class="cal-colheader ${isToday?'istoday':''}">${label}</div>
    <div class="cal-col-body" style="position:relative;height:${totalHeight}px" data-col-body="${ds}">
      ${hourlines}${plannedHtml}${actualHtml}${runningHtml}${nowLineHtml}
    </div>
  </div>`;
}

function renderMonthView(ds){
  const d=new Date(ds+'T00:00:00');
  const year=d.getFullYear(), month=d.getMonth();
  const first=new Date(year,month,1);
  const startOffset=(first.getDay()+6)%7;
  const daysInMonth=new Date(year,month+1,0).getDate();
  let cells='';
  for(let i=0;i<startOffset;i++) cells+=`<div></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dds = year+'-'+pad2(month+1)+'-'+pad2(day);
    const planned = plannedForDate(dds).filter(filterMatch);
    const actual = activitiesForDate(dds).filter(filterMatch);
    const chips = actual.slice(0,2).map(a=>`<div class="cal-block-actual" data-drag-kind="actual" data-drag-mode="date-only" data-drag-id="${a.id}" style="position:static;margin:2px 0;padding:1px 4px;font-size:8.5px;border-radius:4px;background:${catColor(a.categoryId)};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none">${escapeHtml(a.title||'—')}</div>`).join('');
    const moreCount = Math.max(0, actual.length-2);
    cells += `<div data-goto-day="${dds}" style="cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:5px;min-height:66px;background:${dds===todayStr()?'#fdf6e6':'#fff'};position:relative">
      <div style="font-size:11px;color:var(--ink-400)">${day}</div>
      <div style="display:flex;gap:3px;margin-top:2px">
        ${planned.length? `<span class="cal-legend-swatch-planned" style="width:9px;height:9px;border-width:1.5px;margin:0"></span>`:''}
        ${actual.length? `<span class="cal-legend-swatch-actual" style="width:9px;height:9px;margin:0"></span>`:''}
      </div>
      ${chips}
      ${moreCount>0? `<div style="font-size:8.5px;color:var(--ink-400)">+${moreCount} more</div>`:''}
    </div>`;
  }
  return `<div class="rti-card">
    <h3>${d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">
      ${['Mo','Tu','We','Th','Fr','Sa','Su'].map(x=>`<div style="font-size:10px;color:var(--ink-400);text-align:center">${x}</div>`).join('')}
      ${cells}
    </div>
    <p style="font-size:11.5px;color:var(--ink-400);margin-top:10px">Drag a chip onto another day to reschedule its date. Switch to Day or Week view to adjust its time.</p>
  </div>`;
}

function renderTimelineView(ds){
  const planned = plannedForDate(ds).filter(filterMatch).map(p=>Object.assign({}, p, {__kind:'planned'}));
  const actual = activitiesForDate(ds).filter(filterMatch).map(a=>Object.assign({}, a, {__kind:'actual'}));
  const merged = planned.concat(actual).sort((x,y)=>(x.startTime||'').localeCompare(y.startTime||''));
  const rows = merged.map(item=>{
    if(item.__kind==='planned'){
      const status=plannedStatus(item);

          <div style="font-size:11.5px;color:var(--ink-400)">Planned · ${catBreadcrumbStr(item.categoryId)}${item.client? ' · '+escapeHtml(item.client):''} · ${item.startTime}–${item.endTime}</div>

            <button class="rti-btn rti-btn-ghost" style="padding:5px 10px;font-size:11px" data-action="edit-planned" data-id="${item.id}">Edit</button>
            <button class="rti-btn rti-btn-ghost" style="padding:5px 10px;font-size:11px" data-action="delete-planned" data-id="${item.id}">Delete</button>
          </div>
        </div>
      </div>`;
    }
    return `<div class="tl-item">
      <div class="tl-time">${item.startTime||'--'}</div>

}

// ---------------- Calendar drag & resize engine (pointer events: mouse + touch) ----------------
function onCalBlockPointerDown(e){
  const el = this;
  const kind = el.getAttribute('data-drag-kind');
  const id = el.getAttribute('data-drag-id');
  const dateOnly = el.getAttribute('data-drag-mode')==='date-only';
  e.stopPropagation();
  const isResize = e.target.classList.contains('cal-resize-handle');
  const colBody = el.closest('.cal-col-body');
  dragCtx = {
    kind, id, dateOnly,
    mode: isResize? 'resize':'move',
    pointerId: e.pointerId,
    startClientX:e.clientX, startClientY:e.clientY,
    moved:false, el, colBody,
    startTop: el.style.top? parseFloat(el.style.top): 0,
    startHeight: el.style.height? parseFloat(el.style.height): 0,
    gridEl: colBody? colBody.closest('.cal-grid') : null,
  };
  try{ el.setPointerCapture(e.pointerId); }catch(err){}
  el.classList.add('dragging');
  el.addEventListener('pointermove', onCalBlockPointerMove);
  el.addEventListener('pointerup', onCalBlockPointerUp);
  el.addEventListener('pointercancel', onCalBlockPointerUp);
  el.addEventListener('click', function(ev){ ev.stopPropagation(); }, {once:true});
}
function onCalBlockPointerMove(e){
  if(!dragCtx) return;
  const dy = e.clientY - dragCtx.startClientY;
  const dx = e.clientX - dragCtx.startClientX;
  // A finger never lands perfectly still. Below this slop it's a tap (opens the item), above it a drag.
  const slop = (e.pointerType==='touch' || e.pointerType==='pen') ? 10 : 4;
  if(Math.abs(dy)>slop || Math.abs(dx)>slop) dragCtx.moved=true;
  if(!dragCtx.moved) return;
  if(dragCtx.dateOnly){
    dragCtx.el.style.transform = `translate(${dx}px, ${dy}px)`;
    dragCtx.el.style.position = 'relative';
    dragCtx.el.style.zIndex = 50;
    return;
  }
  if(dragCtx.mode==='resize'){
    dragCtx.el.style.height = Math.max(15, dragCtx.startHeight + dy) + 'px';
  } else {
    dragCtx.el.style.top = Math.max(0, dragCtx.startTop + dy) + 'px';
  }
}
function onCalBlockPointerUp(e){
  if(!dragCtx) return;
  const ctx = dragCtx;
  ctx.el.removeEventListener('pointermove', onCalBlockPointerMove);
  ctx.el.removeEventListener('pointerup', onCalBlockPointerUp);
  ctx.el.removeEventListener('pointercancel', onCalBlockPointerUp);
  ctx.el.classList.remove('dragging');
  try{ ctx.el.releasePointerCapture(ctx.pointerId); }catch(err){}
  dragCtx = null;

  if(!ctx.moved){ openEntityDetail(ctx.kind, ctx.id); return; }

  if(ctx.dateOnly){
    ctx.el.style.transform=''; ctx.el.style.position=''; ctx.el.style.zIndex='';
    const dropEl = document.elementFromPoint(e.clientX, e.clientY);
    const dayCell = dropEl ? dropEl.closest('[data-goto-day]') : null;
    if(dayCell){
      const newDate = dayCell.getAttribute('data-goto-day');
      if(ctx.kind==='planned') updatePlannedActivity(ctx.id, {date:newDate});
      else updateActivityTime(ctx.id, {date:newDate});
    }
    render();
    return;
  }

  const startH = ui.gridStartHour, pxm = ui.pxPerMin;
  if(ctx.mode==='resize'){
    const heightPx = parseFloat(ctx.el.style.height);
    const durMin = Math.max(5, snapMinutes(heightPx/pxm, 5));
    if(ctx.kind==='planned'){
      const p = state.plannedActivities.find(x=>x.id===ctx.id);
      if(p) updatePlannedActivity(ctx.id, {endTime: addMinutesToTime(p.startTime, durMin)});
    } else {
      const a = state.activities.find(x=>x.id===ctx.id);
      if(a) updateActivityTime(ctx.id, {endTime: addMinutesToTime(a.startTime||'00:00', durMin)});
    }
  } else {
    const topPx = parseFloat(ctx.el.style.top);
    const newStart = minToTimeStr(snapMinutes(startH*60 + topPx/pxm, 5));
    let newDate = null;
    if(ctx.gridEl){
      const cols = Array.from(ctx.gridEl.querySelectorAll('.cal-col'));
      for(const col of cols){
        const r = col.getBoundingClientRect();
        if(e.clientX>=r.left && e.clientX<=r.right){ newDate = col.getAttribute('data-col-date'); break; }
      }
    }
    if(ctx.kind==='planned'){
      const p = state.plannedActivities.find(x=>x.id===ctx.id);
      if(p) updatePlannedActivity(ctx.id, {date:newDate||p.date, startTime:newStart, endTime: addMinutesToTime(newStart, p.durationMin||30)});
    } else {
      const a = state.activities.find(x=>x.id===ctx.id);
      if(a) updateActivityTime(ctx.id, {date:newDate||a.date, startTime:newStart, endTime: addMinutesToTime(newStart, a.durationMin||30)});
    }
  }
  render();
}

// ---------- Charts ----------
let lastRepeatedGroups = [];

function openDrilldown(title, list, kind){
  ui.modal = {type:'chart-drilldown', title, kind: kind||'activity', ids: list.map(a=>a.id)};
  render();
}

function renderCharts(){
  const range = ui.chartsRange;
  const [from,to] = rangeDates(range);
  const [pfrom,pto] = previousRangeDates(range);
  const list = activitiesInDateRange(from,to);
  const prevList = activitiesInDateRange(pfrom,pto);
  const totalMin = sumDuration(list);
  const prevTotalMin = sumDuration(prevList);

  return `
    <div class="rti-card">
      <div class="rti-row" style="margin-top:0">
        <select id="charts-range">
          ${[['today','Today'],['yesterday','Yesterday'],['this_week','This week'],['last_week','Last week'],['this_month','This month'],['last_month','Last month'],['custom','Custom range']].map(([v,l])=>`<option value="${v}" ${range===v?'selected':''}>${l}</option>`).join('')}
        </select>
        ${range==='custom'? `<input type="date" id="charts-custom-from" value="${ui.chartsCustomFrom}"><span style="color:var(--ink-400);font-size:12px">to</span><input type="date" id="charts-custom-to" value="${ui.chartsCustomTo}">` : ''}

    ${chartMonthlyTrend()}

function chartByCategory(list, prevList, totalMin, prevTotalMin){
  const byCat={}; list.forEach(a=>{ byCat[a.categoryId]=(byCat[a.categoryId]||0)+(a.durationMin||0); });
  const rows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...rows.map(r=>r[1]));
  let explain='No activity recorded in this period yet.';
  if(rows.length){
    const [topId, topMin] = rows[0];
    const curPct = pct(topMin, totalMin);
    const prevMin = sumDuration(prevList.filter(a=>a.categoryId===topId));
    const prevPct = pct(prevMin, prevTotalMin);
    explain = `Most of your time went to ${escapeHtml(catShortBreadcrumb(topId))} — ${minutesToHM(topMin)} (${curPct}% of recorded time), ${ppDelta(curPct,prevPct)} ${previousRangeLabel(ui.chartsRange)}.`;
  }
  return `<div class="rti-card">
    <h3>Time by category</h3>
    ${rows.length===0? emptyState('No data for this range.') : rows.map(([id,mins])=>`
      <div class="rti-barrow" style="cursor:pointer" data-action="drill-category" data-catid="${id}">
        <div class="lab">${escapeHtml(catShortBreadcrumb(id))}</div>
        <div class="track"><div class="fill" style="width:${(mins/max)*100}%;background:${catColor(id)}"></div></div>
        <div class="val">${minutesToHM(mins)}</div>
      </div>`).join('')}
    <p class="chart-explain">${explain}</p>
  </div>`;
}

function chartByProject(list, totalMin){
  const byProj={}; list.forEach(a=>{ if(a.project) byProj[a.project]=(byProj[a.project]||0)+(a.durationMin||0); });
  const rows=Object.entries(byProj).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(1,...rows.map(r=>r[1]));
  const explain = rows.length? `Your top project was "${escapeHtml(rows[0][0])}" at ${minutesToHM(rows[0][1])} — ${pct(rows[0][1], totalMin)}% of all recorded time this period.` : 'No project-tagged activities in this range.';

    <h3>Time by project</h3>

}

function chartByClient(list){
