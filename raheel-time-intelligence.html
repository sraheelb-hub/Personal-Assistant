function chartProductivity(list, prevList){
  const total=sumDuration(list)||1;
  const prevTotal=sumDuration(prevList)||1;
  const lowval=sumDuration(list.filter(a=>a.productivity==='low-value'||a.productivity==='avoidable'));
  const prod=Math.max(0,sumDuration(list)-lowval);
  const prevLow=sumDuration(prevList.filter(a=>a.productivity==='low-value'||a.productivity==='avoidable'));
  const curPct=pct(lowval,total), prevPct=pct(prevLow,prevTotal);
  return `<div class="rti-card">
    <h3>Productive vs low-value time</h3>
    <div class="rti-barrow" style="cursor:pointer" data-action="drill-productivity" data-value="high"><div class="lab">Productive/necessary</div><div class="track"><div class="fill" style="width:${(prod/total)*100}%;background:var(--ok-green)"></div></div><div class="val">${minutesToHM(prod)}</div></div>
    <div class="rti-barrow" style="cursor:pointer" data-action="drill-productivity" data-value="low"><div class="lab">Low-value/avoidable</div><div class="track"><div class="fill" style="width:${(lowval/total)*100}%;background:var(--bad-red)"></div></div><div class="val">${minutesToHM(lowval)}</div></div>
    <p class="chart-explain">You spent ${curPct}% of your recorded work time on low-value or avoidable activities ${rangeLabel(ui.chartsRange)}. This was ${ppDelta(curPct,prevPct)} ${previousRangeLabel(ui.chartsRange)}.</p>
  </div>`;
}

function chartRevenue(list, prevList){
  const total=sumDuration(list)||1;
  const prevTotal=sumDuration(prevList)||1;
  const rev=sumDuration(list.filter(a=>a.revenue==='revenue-generating'));
  const prevRev=sumDuration(prevList.filter(a=>a.revenue==='revenue-generating'));
  const nonrev=Math.max(0,sumDuration(list)-rev);
  const curPct=pct(rev,total), prevPct=pct(prevRev,prevTotal);
  return `<div class="rti-card">
    <h3>Revenue-generating vs administrative time</h3>
    <div class="rti-barrow" style="cursor:pointer" data-action="drill-revenue" data-value="revenue-generating"><div class="lab">Revenue-generating</div><div class="track"><div class="fill" style="width:${(rev/total)*100}%;background:var(--gold-600)"></div></div><div class="val">${minutesToHM(rev)}</div></div>
    <div class="rti-barrow" style="cursor:pointer" data-action="drill-revenue" data-value="non-revenue"><div class="lab">Non-revenue / admin</div><div class="track"><div class="fill" style="width:${(nonrev/total)*100}%;background:var(--ink-400)"></div></div><div class="val">${minutesToHM(nonrev)}</div></div>
    <p class="chart-explain">${curPct}% of recorded time ${rangeLabel(ui.chartsRange)} was revenue-generating, ${ppDelta(curPct,prevPct)} ${previousRangeLabel(ui.chartsRange)}.</p>
  </div>`;
}

function chartPlannedActual(from,to,pfrom,pto){
  const planned=plannedInDateRange(from,to), actual=activitiesInDateRange(from,to);
  const prevPlanned=plannedInDateRange(pfrom,pto), prevActual=activitiesInDateRange(pfrom,pto);
  const plannedMin=sumDuration(planned), actualMin=sumDuration(actual);
  const prevPlannedMin=sumDuration(prevPlanned), prevActualMin=sumDuration(prevActual);
  // These two are independent totals being compared, not slices of one pie — scale both against
  // whichever is larger so their bar lengths are directly comparable to each other.
  const scale=Math.max(plannedMin, actualMin) || 1;
  const adherence = plannedMin>0? Math.round((actualMin/plannedMin)*100) : null;
  const prevAdherence = prevPlannedMin>0? Math.round((prevActualMin/prevPlannedMin)*100) : null;
  const explain = adherence==null
    ? 'No planned activities were scheduled in this period to compare against.'
    : `You logged ${adherence}% of the time you had planned ${rangeLabel(ui.chartsRange)}` + (prevAdherence!=null? `, versus ${prevAdherence}% ${previousRangeLabel(ui.chartsRange)}.` : '.');
  return `<div class="rti-card">
    <h3>Planned vs actual time</h3>
    <div class="rti-barrow" style="cursor:pointer" data-action="drill-planned-actual" data-value="planned"><div class="lab">Planned</div><div class="track"><div class="fill" style="width:${(plannedMin/scale)*100}%;background:var(--maroon-700)"></div></div><div class="val">${minutesToHM(plannedMin)}</div></div>
    <div class="rti-barrow" style="cursor:pointer" data-action="drill-planned-actual" data-value="actual"><div class="lab">Actual (logged)</div><div class="track"><div class="fill" style="width:${(actualMin/scale)*100}%;background:var(--gold-600)"></div></div><div class="val">${minutesToHM(actualMin)}</div></div>
    <p class="chart-explain">${explain}</p>
  </div>`;
}

function chartDailyHours(from,to){
  const fromD=new Date(from+'T00:00:00'), toD=new Date(to+'T00:00:00');
  let days=Math.round((toD-fromD)/86400000)+1;
  const capped = days>31;
  const spanDays = capped? 31 : days;
  const startD = capped? new Date(toD.getTime()-(spanDays-1)*86400000) : fromD;
  const bars=[];
  let maxMin=1;
  for(let i=0;i<spanDays;i++){
    const d=new Date(startD); d.setDate(startD.getDate()+i);
    const ds=d.toISOString().slice(0,10);
    const mins=sumDuration(activitiesForDate(ds));
    bars.push({ds,mins,label:d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})});
    if(mins>maxMin) maxMin=mins;
  }
  const busiest = bars.reduce((b,x)=>x.mins>b.mins?x:b, bars[0]||{mins:0,label:''});
  const avgMin = bars.length? Math.round(bars.reduce((s,b)=>s+b.mins,0)/bars.length) : 0;
  return `<div class="rti-card">
    <h3>Daily recorded hours</h3>
    ${capped? `<p style="font-size:11px;color:var(--ink-400);margin:0 0 6px">Showing the most recent 31 days of this range.</p>`:''}
    <div style="display:flex;align-items:flex-end;gap:3px;height:110px;overflow-x:auto;padding-top:6px">
      ${bars.map(b=>`<div data-action="drill-range" data-from="${b.ds}" data-to="${b.ds}" data-label="${b.label}" title="${b.label}: ${minutesToHM(b.mins)}" style="cursor:pointer;flex:0 0 auto;width:12px;height:${Math.max(2,(b.mins/maxMin)*100)}px;background:${b.ds===todayStr()?'var(--gold-600)':'var(--maroon-700)'};border-radius:3px 3px 0 0"></div>`).join('')}
    </div>
    <p class="chart-explain">${bars.length? `Your busiest day was ${busiest.label} with ${minutesToHM(busiest.mins)} logged; the daily average across this range was ${minutesToHM(avgMin)}.` : 'No data yet.'}</p>
  </div>`;
}

function chartWeeklyTrend(){
  const today=new Date();
  const curDay=(today.getDay()+6)%7;
  const thisMonday=new Date(today); thisMonday.setDate(today.getDate()-curDay);
  const weeks=[];
  for(let i=7;i>=0;i--){
    const mon=new Date(thisMonday); mon.setDate(thisMonday.getDate()-i*7);
    const sun=new Date(mon); sun.setDate(mon.getDate()+6);
    const from=mon.toISOString().slice(0,10), to=sun.toISOString().slice(0,10);
    const mins=sumDuration(activitiesInDateRange(from,to));
    weeks.push({from,to,mins,label:mon.toLocaleDateString('en-GB',{day:'numeric',month:'short'})});
  }
  const maxMin=Math.max(1,...weeks.map(w=>w.mins));
  const thisW=weeks[weeks.length-1].mins, lastW=weeks[weeks.length-2]?weeks[weeks.length-2].mins:0;
  const delta = lastW>0? Math.round(((thisW-lastW)/lastW)*100) : null;
  const trendTxt = delta==null? '' : (delta>=0? ` — up ${delta}% on last week.` : ` — down ${Math.abs(delta)}% on last week.`);
  return `<div class="rti-card">
    <h3>Weekly trend <span style="font-size:11px;color:var(--ink-400);font-weight:400">(last 8 weeks)</span></h3>
    <div style="display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px">
      ${weeks.map(w=>`<div class="chart-trend-col">
        <div class="chart-trend-bararea" style="height:90px">
          <div class="chart-trend-bar" data-action="drill-range" data-from="${w.from}" data-to="${w.to}" data-label="Week of ${w.label}" title="Week of ${w.label}: ${minutesToHM(w.mins)}" style="height:${Math.max(2,(w.mins/maxMin)*90)}px;background:var(--gold-600)"></div>
        </div>
        <span class="chart-trend-label">${w.label}</span>
      </div>`).join('')}
    </div>
    <p class="chart-explain">This week totals ${minutesToHM(thisW)}${trendTxt}</p>
  </div>`;
}

function chartMonthlyTrend(){
  const today=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(today.getFullYear(), today.getMonth()-i, 1);
    const first=new Date(d.getFullYear(),d.getMonth(),1);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0);
    const from=first.toISOString().slice(0,10), to=last.toISOString().slice(0,10);
    const mins=sumDuration(activitiesInDateRange(from,to));
    months.push({from,to,mins,label:d.toLocaleDateString('en-GB',{month:'short'})});
  }
  const maxMin=Math.max(1,...months.map(m=>m.mins));
  const thisM=months[months.length-1].mins, lastM=months[months.length-2]?months[months.length-2].mins:0;
  const delta=lastM>0? Math.round(((thisM-lastM)/lastM)*100): null;
  const trendTxt = delta==null? '' : (delta>=0? ` — up ${delta}% on last month.` : ` — down ${Math.abs(delta)}% on last month.`);
  return `<div class="rti-card">
    <h3>Monthly trend <span style="font-size:11px;color:var(--ink-400);font-weight:400">(last 6 months)</span></h3>
    <div style="display:flex;align-items:flex-end;gap:12px;height:130px;padding-top:6px">
      ${months.map(m=>`<div class="chart-trend-col">
        <div class="chart-trend-bararea" style="height:100px">
          <div class="chart-trend-bar" data-action="drill-range" data-from="${m.from}" data-to="${m.to}" data-label="${m.label}" title="${m.label}: ${minutesToHM(m.mins)}" style="height:${Math.max(2,(m.mins/maxMin)*100)}px;background:var(--maroon-700)"></div>
        </div>
        <span class="chart-trend-label">${m.label}</span>
      </div>`).join('')}
    </div>
    <p class="chart-explain">This month totals ${minutesToHM(thisM)}${trendTxt}</p>
  </div>`;
}

function chartTopActivities(list, totalMin){
  const rows = list.slice().sort((a,b)=>(b.durationMin||0)-(a.durationMin||0)).slice(0,8);
  const max=Math.max(1,...rows.map(a=>a.durationMin||0));
  const explain = rows.length? `Your single longest activity was "${escapeHtml(rows[0].title||'untitled')}" at ${minutesToHM(rows[0].durationMin)} — ${pct(rows[0].durationMin, totalMin)}% of all recorded time this period.` : 'No activities recorded in this range.';
  return `<div class="rti-card">
    <h3>Most time-consuming activities</h3>
    ${rows.length===0? emptyState('No data for this range.') : rows.map(a=>`
      <div class="rti-barrow" style="cursor:pointer" data-action="drill-activity" data-id="${a.id}">
        <div class="lab">${escapeHtml((a.title||'untitled').slice(0,28))}</div>
        <div class="track"><div class="fill" style="width:${((a.durationMin||0)/max)*100}%;background:${catColor(a.categoryId)}"></div></div>
        <div class="val">${minutesToHM(a.durationMin)}</div>
      </div>`).join('')}
    <p class="chart-explain">${explain}</p>
  </div>`;
}

function chartRepeated(list){
  const groups={};
  list.forEach(a=>{
    const key = normName(a.title||'');
    if(!key) return;
    if(!groups[key]) groups[key]={title:a.title||'(untitled)', mins:0, count:0, ids:[]};
    groups[key].mins+=(a.durationMin||0);
    groups[key].count+=1;
    groups[key].ids.push(a.id);
  });
  const rows = Object.values(groups).filter(g=>g.count>=2).sort((a,b)=>b.mins-a.mins).slice(0,8);
  lastRepeatedGroups = rows;
  const max=Math.max(1,...rows.map(r=>r.mins));
  const explain = rows.length? `"${escapeHtml(rows[0].title)}" recurred ${rows[0].count} times this period, totalling ${minutesToHM(rows[0].mins)}.` : 'No activity repeated more than once in this period.';
  return `<div class="rti-card">
    <h3>Repeated activities</h3>
    ${rows.length===0? emptyState('Nothing repeated in this range yet.') : rows.map((r,i)=>`
      <div class="rti-barrow" style="cursor:pointer" data-action="drill-repeated" data-idx="${i}">
        <div class="lab">${escapeHtml(r.title)} ×${r.count}</div>
        <div class="track"><div class="fill" style="width:${(r.mins/max)*100}%;background:var(--warn-amber)"></div></div>
        <div class="val">${minutesToHM(r.mins)}</div>
      </div>`).join('')}
    <p class="chart-explain">${explain}</p>
  </div>`;
}

function chartFollowups(list, prevList){
  const pending = list.filter(a=>a.followUpNeeded===true);
  const resolved = list.filter(a=>a.followUpNeeded===false);
  const prevPendingCount = prevList.filter(a=>a.followUpNeeded===true).length;
  const total = (pending.length+resolved.length) || 1;
  const delta = prevPendingCount>0? Math.round(((pending.length-prevPendingCount)/prevPendingCount)*100) : null;
  const trendTxt = delta==null? '' : (delta>=0? `, ${delta}% more than ${previousRangeLabel(ui.chartsRange)}` : `, ${Math.abs(delta)}% fewer than ${previousRangeLabel(ui.chartsRange)}`);
  return `<div class="rti-card">
    <h3>Pending follow-ups</h3>
    <div class="rti-barrow" style="cursor:pointer" data-action="drill-followup" data-value="pending"><div class="lab">Pending</div><div class="track"><div class="fill" style="width:${(pending.length/total)*100}%;background:var(--warn-amber)"></div></div><div class="val">${pending.length}</div></div>
    <div class="rti-barrow" style="cursor:pointer" data-action="drill-followup" data-value="resolved"><div class="lab">No follow-up needed</div><div class="track"><div class="fill" style="width:${(resolved.length/total)*100}%;background:var(--ok-green)"></div></div><div class="val">${resolved.length}</div></div>
    <p class="chart-explain">You have ${pending.length} pending follow-up${pending.length===1?'':'s'} ${rangeLabel(ui.chartsRange)}${trendTxt}.</p>
  </div>`;
}

function renderGoalCard(g){
  const p = computeGoalProgress(g);
  const fmtVal = v => g.metric.kind==='time' ? minutesToHM(v) : v;
  const pctFill = g.metric.targetValue>0 ? Math.min(100, Math.round((p.current/g.metric.targetValue)*100)) : 0;
  const barColor = p.met ? 'var(--ok-green)' : (p.paceStatus==='behind'||p.paceStatus==='exceeded' ? 'var(--bad-red)':'var(--gold-600)');
  const trend = goalWeeklyTrend(g,6);
  const meta = GOAL_PACE_META[p.paceStatus] || {label:'', color:'var(--ink-400)'};
  return `<div style="padding:12px 4px;border-bottom:1px solid var(--line)">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div>
        <div style="font-weight:600;font-size:14px">${escapeHtml(g.title)}</div>
        <div style="font-size:11.5px;color:var(--ink-400)">${escapeHtml(g.rawText)}</div>
      </div>
      <span class="rti-tag" style="background:${meta.color}22;color:${meta.color};white-space:nowrap">${meta.label}</span>
    </div>
    <div class="track" style="margin-top:8px;height:10px"><div class="fill" style="width:${pctFill}%;background:${barColor};height:100%;border-radius:6px"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-600);margin-top:4px">
      <span>${fmtVal(p.current)} of ${fmtVal(g.metric.targetValue)} ${g.metric.direction==='at_most'?'cap':'target'}</span>
      <span>${p.met ? (g.metric.direction==='at_most'?'Within cap':'Reached') : (g.metric.direction==='at_most'? 'Over by '+fmtVal(p.remaining) : fmtVal(p.remaining)+' remaining')}</span>
    </div>
    ${g.metric.period==='week'? `<div style="font-size:11px;color:var(--ink-400);margin-top:2px">${p.daysLeft} day${p.daysLeft===1?'':'s'} left this week</div>` : (p.noTargetToday? `<div style="font-size:11px;color:var(--ink-400);margin-top:2px">No target today (weekday goal)</div>`:'')}
    <div style="display:flex;gap:3px;margin-top:8px" title="Last 6 weeks">
      ${trend.map(w=>`<div title="${w.label}: ${fmtVal(w.value)}" style="flex:1;height:16px;border-radius:3px;background:${w.achieved?'var(--ok-green)':'var(--line)'};${w.isCurrent?'box-shadow:0 0 0 2px var(--maroon-800) inset':''}"></div>`).join('')}
    </div>
    <div class="rti-row" style="margin-top:8px">
      <button class="rti-btn rti-btn-ghost" style="padding:4px 9px;font-size:11px" data-action="delete-goal" data-id="${g.id}">Remove goal</button>
    </div>
  </div>`;
}
function renderLatestGoalReview(){
  const history = state.goalReviewHistory||[];
  const latest = ui.lastGoalReview || (history.length? history[history.length-1] : null);
  if(!latest) return emptyState('No weekly review generated yet.');
  return `
    <p style="font-size:12px;color:var(--ink-400)">${latest.from} to ${latest.to}</p>
    ${latest.summary.length===0? emptyState('No summary was returned — try generating again.') : latest.summary.map(s=>`

function fmtBytes(n){
  if(n<1024) return n+' B';
  if(n<1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/(1024*1024)).toFixed(2)+' MB';
}
function fmtWhen(ts){
  if(!ts) return 'never';
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function backLink(label){

}

function renderUpgradeCentreScreen(){
  const total = activeActivities().length;
  const deleted = state.activities.filter(a=>a.deletedAt).length;
  const storageSize = fmtBytes(new Blob([JSON.stringify(state)]).size);
  const recordCounts = [
    ['Activities (active)', total],
    ['Activities (trash)', deleted],
    ['Planned/calendar entries', activePlanned().length],
    ['Categories', state.categories.filter(c=>!c.archived).length],
    ['Rules', activeRules().length],
    ['Goals', activeGoals().length],
    ['AI analyses saved', (state.aiAnalysisHistory||[]).length],
    ['Recommendation feedback records', (state.recommendationFeedback||[]).length],
  ];
  const recentMigrations = (state.migrationLog||[]).slice().sort((a,b)=>b.appliedAt-a.appliedAt).slice(0,6);
  const recentErrors = (state.errorLog||[]).slice().sort((a,b)=>b.ts-a.ts).slice(0,6);
  const lastBackup = ui.backupsList && ui.backupsList.length ? ui.backupsList[0] : (state.lastBackupAt? {savedAt:state.lastBackupAt, reason:'—'} : null);
  return `
    <div class="rti-card">
      ${backLink()}
      <h3>App info &amp; version</h3>
      <div class="rti-grid">
        <div class="rti-stat"><div class="num" style="font-size:17px">${APP_VERSION}</div><div class="lbl">App version</div></div>
        <div class="rti-stat"><div class="num" style="font-size:17px">v${state.schemaVersion}</div><div class="lbl">Database version</div></div>
        <div class="rti-stat"><div class="num" style="font-size:13px">${lastBackup? fmtWhen(lastBackup.savedAt) : 'Never'}</div><div class="lbl">Last successful backup</div></div>
        <div class="rti-stat"><div class="num" style="font-size:17px">${storageSize}</div><div class="lbl">Storage used</div></div>
      </div>

      <h3 style="margin-top:18px">What's stored</h3>
      <div style="font-size:12.5px;color:var(--ink-600);line-height:1.9">
        ${recordCounts.map(([label,n])=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0"><span>${label}</span><b>${n}</b></div>`).join('')}
      </div>

      <h3 style="margin-top:18px">Update history</h3>
      ${recentMigrations.length===0? `<p style="font-size:12.5px;color:var(--ink-400)">No updates have run yet.</p>` : recentMigrations.map(m=>`
        <div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px">
          <span style="color:${m.status==='success'?'var(--ok-green)':'var(--bad-red)'}">${m.status==='success'?'✓':'✕'} v${m.version} — ${escapeHtml(m.description||'')}</span>
          <span style="color:var(--ink-400);white-space:nowrap">${fmtWhen(m.appliedAt)}</span>
        </div>`).join('')}

      <h3 style="margin-top:18px">Error log ${recentErrors.length? `(${(state.errorLog||[]).length} total)`:''}</h3>
      ${recentErrors.length===0? `<p style="font-size:12.5px;color:var(--ink-400)">No errors logged.</p>` : recentErrors.map(e=>`
        <div style="padding:6px 0;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink-600)">
          <span style="color:var(--bad-red)">${escapeHtml(e.context)}</span> — ${escapeHtml(e.message)} <span style="color:var(--ink-400)">(${fmtWhen(e.ts)})</span>
        </div>`).join('')}

      <p style="font-size:11.5px;color:var(--ink-400);margin-top:14px;line-height:1.6">
        Updates only ever add or improve — they never delete your existing records. Every update is tested against a copy of your data first and a backup is always taken beforehand, so you're covered either way.
      </p>
    </div>
  `;
}

      const items = ui.modal.ids.map(id=>state.plannedActivities.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>(b.date+(b.startTime||'')).localeCompare(a.date+(a.startTime||'')));
      const total = sumDuration(items);
      return `<div class="rti-modal-bg" data-action="close-modal">
        <div class="rti-modal" onclick="event.stopPropagation()">
          <h3 class="rti-serif" style="margin-top:0">${escapeHtml(ui.modal.title)}</h3>
          <p style="font-size:12.5px;color:var(--ink-600)">${items.length} planned · ${minutesToHM(total)} total</p>
          ${items.length===0? emptyState('Nothing matches.') : items.map(p=>{
            const meta=PLANNED_STATUS_META[plannedStatus(p)];
            return `<div style="padding:9px 4px;border-bottom:1px solid var(--line)">
              <div style="font-weight:600;font-size:13.5px">${escapeHtml(p.title||'(untitled)')} <span class="rti-tag" style="background:${meta.color}22;color:${meta.color}">${meta.label}</span></div>
              <div style="font-size:11.5px;color:var(--ink-400)">${escapeHtml(catBreadcrumbStr(p.categoryId))} · ${p.date} · ${p.startTime}–${p.endTime}</div>
            </div>`;
          }).join('')}
          <div class="rti-row" style="margin-top:10px"><button class="rti-btn rti-btn-ghost" data-action="close-modal">Close</button></div>
        </div>
      </div>`;
    }
    const items = ui.modal.ids.map(id=>state.activities.find(a=>a.id===id)).filter(Boolean).sort((a,b)=>(b.date+(b.startTime||'')).localeCompare(a.date+(a.startTime||'')));
    const total = sumDuration(items);
    return `<div class="rti-modal-bg" data-action="close-modal">
      <div class="rti-modal" onclick="event.stopPropagation()">
        <h3 class="rti-serif" style="margin-top:0">${escapeHtml(ui.modal.title)}</h3>
        <p style="font-size:12.5px;color:var(--ink-600)">${items.length} activit${items.length===1?'y':'ies'} · ${minutesToHM(total)} total</p>
        ${items.length===0? emptyState('Nothing matches.') : items.map(activityRow).join('')}
        <div class="rti-row" style="margin-top:10px"><button class="rti-btn rti-btn-ghost" data-action="close-modal">Close</button></div>
      </div>
    </div>`;
  }
  if(ui.modal.type==='import-data'){
    return `<div class="rti-modal-bg" data-action="close-modal">
      <div class="rti-modal" onclick="event.stopPropagation()">
        <h3 class="rti-serif" style="margin-top:0">Import data</h3>
        <p style="font-size:12.5px;color:var(--ink-600)">Choose a .json (full backup), .csv, or .xlsx file. You'll see a full preview before anything is written.</p>
        <input type="file" id="import-file-input" accept=".json,.csv,.xlsx,.xls" style="width:100%">
        <div class="rti-row" style="margin-top:14px"><button class="rti-btn rti-btn-ghost" data-action="close-modal">Cancel</button></div>
      </div>
    </div>`;
  }
  if(ui.modal.type==='import-preview'){
    const p = ui.pendingImport ? ui.pendingImport.preview : null;
    if(!p) return '';
    return `<div class="rti-modal-bg" data-action="close-modal">
      <div class="rti-modal" onclick="event.stopPropagation()">
        <h3 class="rti-serif" style="margin-top:0">Review before importing</h3>
        <div style="font-size:13px;line-height:1.85">
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0"><span>Records found</span><b>${p.totalRecords} activities${p.plannedCount?`, ${p.plannedCount} calendar entries`:''}${p.categoriesCount?`, ${p.categoriesCount} categories`:''}${p.rulesCount?`, ${p.rulesCount} rules`:''}${p.goalsCount?`, ${p.goalsCount} goals`:''}</b></div>
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0"><span>New activities</span><b style="color:var(--ok-green)">${p.newCount}</b></div>
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0"><span>Possible duplicates</span><b style="color:var(--warn-amber)">${p.dupCount}</b></div>
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0"><span>Invalid records (skipped)</span><b style="color:var(--bad-red)">${p.invalidCount}</b></div>
          <div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0"><span>Date range covered</span><b>${p.dateRange}</b></div>
          <div style="padding:3px 0"><span>Categories that will be created</span><br><b>${p.categoriesToCreate.length? escapeHtml(p.categoriesToCreate.join(', ')) : 'None'}</b></div>
        </div>
        <p style="font-size:11.5px;color:var(--ink-400);margin-top:10px">Nothing is imported until you confirm. <b>Merge</b> keeps everything you have and only adds new records or updates ones with a newer edit timestamp. <b>Replace all</b> wipes current data first — either way a safety backup is taken automatically.</p>
        <div class="rti-row" style="margin-top:12px">
          <button class="rti-btn rti-btn-gold" data-action="import-confirm-merge">Merge (recommended)</button>
          <button class="rti-btn rti-btn-danger" data-action="import-confirm-replace">Replace all data</button>
          <button class="rti-btn rti-btn-ghost" data-action="close-modal">Cancel</button>
        </div>
      </div>
    </div>`;
  }
  if(ui.modal.type==='restore-backup'){
    const list = ui.backupsList||[];
    return `<div class="rti-modal-bg" data-action="close-modal">
      <div class="rti-modal" onclick="event.stopPropagation()">
        <h3 class="rti-serif" style="margin-top:0">Restore a backup</h3>
        <p style="font-size:12.5px;color:var(--ink-600)">Restoring will first automatically back up your current data, so this is always reversible.</p>
        ${list.length===0? emptyState('No backups yet — use "Back up now" first.') : list.map(b=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">
            <div style="font-size:12.5px">
              <div>${fmtWhen(b.savedAt)}</div>
              <div style="color:var(--ink-400);font-size:11px">${escapeHtml(b.reason||'')} · schema v${b.schemaVersion}</div>
            </div>
            <button class="rti-btn rti-btn-danger" data-action="restore-backup-confirm" data-key="${b.key}" style="padding:5px 10px;font-size:11px">Restore</button>
          </div>`).join('')}
        <div class="rti-row" style="margin-top:12px"><button class="rti-btn rti-btn-ghost" data-action="close-modal">Close</button></div>
      </div>
    </div>`;
  }
  if(ui.modal.type==='pdf-report'){
    const [df,dt] = rangeDates('this_month');
    return `<div class="rti-modal-bg" data-action="close-modal">
      <div class="rti-modal" onclick="event.stopPropagation()">
        <h3 class="rti-serif" style="margin-top:0">Export report to PDF</h3>
        <p style="font-size:12.5px;color:var(--ink-600)">Pick a date range, then use your browser's print dialog to save as PDF.</p>
        <div class="rti-row">
          <input type="date" id="pdf-report-from" value="${df}">
          <span style="color:var(--ink-400);font-size:12px">to</span>
          <input type="date" id="pdf-report-to" value="${dt}">
        </div>
        <div class="rti-row" style="margin-top:12px">
          <button class="rti-btn rti-btn-gold" data-action="generate-pdf-report">Generate &amp; print</button>
          <button class="rti-btn rti-btn-ghost" data-action="close-modal">Cancel</button>
        </div>
      </div>
    </div>`;
  }
  return '';
}

// ================= EVENTS =================
function bindEvents(){
  const root = document.getElementById('rti-root');

  root.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      ui.tab = el.getAttribute('data-nav');
      if(ui.tab!=='add'){ ui.editDraft=null; }
      else { ui.addStage='choose'; ui.pendingActivity=null; ui.editDraft=null; }
      render();
      if(ui.tab==='settings') refreshBackupsList();
    });
  });

  bind('[data-action="toast-undo"]', ()=>{
    if(ui.toastAction && ui.toastAction.run) ui.toastAction.run();
    ui.toast=null; ui.toastAction=null; render();
  });
  bind('[data-action="goto-settings"]', ()=>{ ui.tab='settings'; render(); });
  bind('[data-action="goto-data-backup"]', ()=>{ ui.tab='data-backup'; render(); refreshBackupsList(); });
  bind('[data-action="goto-goals-screen"]', ()=>{ ui.tab='goals'; render(); });
  bind('[data-action="goto-categories-screen"]', ()=>{ ui.tab='categories'; render(); });
  bind('[data-action="goto-upgrade-centre"]', ()=>{ ui.tab='upgrade-centre'; render(); refreshBackupsList(); });
  bind('[data-action="goto-ai-setup"]', ()=>{ ui.tab='ai-setup'; render(); });
  bind('[data-action="goto-projects-screen"]', ()=>{ ui.tab='projects'; render(); });
  bind('[data-action="goto-appearance"]', ()=>{ ui.tab='appearance'; render(); });
  bind('[data-action="pick-theme"]', function(){
    const id=this.getAttribute('data-id');
    setTheme(id); render();
    showToast(THEMES[id].name+' applied.');
  }, true);
  bind('[data-action="project-add"]', ()=>{
    const el=document.getElementById('new-project-name');
    const name=el.value.trim();
    if(!name){ showToast('Type a project name first.'); return; }
    if(projectByName(name) && !projectByName(name).deletedAt){ showToast('That project already exists.'); return; }
    createProject(name); scheduleSave(); render();
    showToast('Project added.');
  });
  bind('[data-action="project-restore"]', function(){
    createProject(this.getAttribute('data-name')); scheduleSave(); render();
    showToast('Project added back.');
  }, true);
  bind('[data-action="project-rename"]', function(){
    ui.modal={type:'project-rename', id:this.getAttribute('data-id')}; render();
  }, true);
  bind('[data-action="project-rename-confirm"]', function(){
    const id=this.getAttribute('data-id');
    const val=document.getElementById('project-rename-input').value.trim();
    if(!val){ showToast('Enter a name.'); return; }
    const n=renameProject(id, val);
    ui.modal=null; render();
    showToast(`Renamed — ${n} activit${n===1?'y':'ies'} updated.`);
  }, true);
  bind('[data-action="project-delete"]', function(){
    const id=this.getAttribute('data-id');
    const p=(state.projects||[]).find(x=>x.id===id);
    deleteProject(id); render();
    showToastAction('Project removed from the list.', 'Undo', ()=>{
      if(p){ p.deletedAt=null; scheduleSave(); render(); }
    });
  }, true);
  bind('[data-action="save-ai-key"]', ()=>{
    const v=document.getElementById('ai-key-input').value.trim();
    if(!v){ showToast('Paste your key first.'); return; }
    setApiKey(v); render(); showToast('AI features switched on.');
  });
  bind('[data-action="clear-ai-key"]', ()=>{ setApiKey(''); render(); showToast('Key removed.'); });
  bind('[data-action="insights-view"]', function(){ ui.insightsView=this.getAttribute('data-view'); render(); }, true);

  const q = document.getElementById('rti-quickinput');
  const act = (sel)=>{ const el=root.querySelector(sel); return el; };

  bind('[data-action="quick-save"]', async ()=>{
    const val = document.getElementById('rti-quickinput').value.trim();
    if(!val){ showToast('Type something first.'); return; }
    ui.pendingActivity = newDraftActivity({originalInput: val, date: todayStr()});
    ui.tab='add'; ui.addStage='type'; ui.addAnalysing=true; render();
    await analyseActivity(ui.pendingActivity);
    ui.addAnalysing=false; ui.addStage='confirm'; render();
  });
  bind('[data-action="goto-add"]', ()=>{ ui.tab='add'; ui.addStage='full-edit'; ui.editDraft=newDraftActivity(); render(); });
  bind('[data-action="start-timer"]', startTimer);
  bind('[data-action="stop-timer"]', stopTimerAndOpenDraft);

  bind('[data-action="voice-input-draft"]', ()=>voiceInput('draft-original'));
  bind('[data-action="goto-ai-daily"]', ()=>{ ui.tab='insights'; ui.insightsView='ai'; ui.aiScope='daily'; render(); runAiAnalysis('daily'); });

  bind('[data-action="edit-activity"]', function(){
    const id=this.getAttribute('data-id');
    const a = state.activities.find(x=>x.id===id);
    ui.editDraft = JSON.parse(JSON.stringify(a));
    ui.tab='add'; ui.addStage='full-edit'; render();
  }, true);

  // --- New 3-option Add Activity flow ---
  bind('[data-action="choose-type"]', ()=>beginAddChoice('type'));
  bind('[data-action="choose-voice"]', ()=>beginAddChoice('voice'));
  bind('[data-action="choose-timer"]', ()=>beginAddChoice('timer'));
  bind('[data-action="add-back"]', backToChoose);
  bind('[data-action="add-analyse"]', analysePendingActivity);
  bind('[data-action="voice-retry"]', ()=>voiceInput('pending-input', true));
  bind('[data-action="confirm-save-pending"]', confirmSavePending);
  bind('[data-action="confirm-edit-pending"]', editPendingFully);

  bind('[data-action="draft-categorise"]', async ()=>{
    const text = document.getElementById('draft-original').value.trim();
    if(!text){ showToast('Add a description first.'); return; }
    let d = readDraftFromForm();
    if(!d.id){
      d = Object.assign({}, d, {id:null});
      const saved = Object.assign({}, d);
      const tempId = uid('act');
      const now=Date.now();
      const a = Object.assign({}, saved, {id:tempId, createdAt:now, updatedAt:now, deletedAt:null, confidence:null, classificationHistory:[], aiOriginalClassification:null, aiPending:false});
      state.activities.unshift(a);
      ui.editDraft = a;
      await aiCategorize(tempId);
      ui.editDraft = JSON.parse(JSON.stringify(state.activities.find(x=>x.id===tempId)));
      render();
    } else {
      await aiCategorize(d.id);
      ui.editDraft = JSON.parse(JSON.stringify(state.activities.find(x=>x.id===d.id)));
      render();
    }
  });

  bind('[data-action="save-draft"]', ()=>{
    const d = readDraftFromForm();
    saveDraftActivity(d, false);
  });
  bind('[data-action="cancel-draft"]', ()=>{ ui.editDraft=null; ui.addStage='choose'; ui.pendingActivity=null; ui.tab='today'; render(); });
  bind('[data-action="delete-draft"]', ()=>{
    if(ui.editDraft && ui.editDraft.id){ ui.modal={type:'delete-confirm', activityId:ui.editDraft.id}; render(); }
  });

  bind('[data-action="close-modal"]', ()=>{ ui.modal=null; render(); });
  bind('[data-action="confirm-delete"]', function(){ softDeleteActivity(this.getAttribute('data-id')); ui.tab='today'; ui.editDraft=null; });
  bind('[data-action="show-trash"]', ()=>{ ui.modal={type:'trash'}; render(); });
  bind('[data-action="restore-activity"]', function(){
    const a = state.activities.find(x=>x.id===this.getAttribute('data-id'));
    if(a){ a.deletedAt=null; scheduleSave(); }
    render();
  }, true);

  // Calendar
  bind('#cal-view', null, false, 'change', function(){ ui.calendarView=this.value; render(); });
  bind('#cal-date', null, false, 'change', function(){ ui.calendarDate=this.value; render(); });
  bind('[data-action="toggle-cal-filters"]', ()=>{ ui.calendarFiltersOpen=!ui.calendarFiltersOpen; render(); });
  bind('#cal-filter-cat', null, false, 'change', function(){ ui.filter.category=this.value; render(); });
  bind('#cal-filter-project', null, false, 'change', function(){ ui.filter.project=this.value; render(); });
  bind('#cal-filter-client', null, false, 'change', function(){ ui.filter.client=this.value; render(); });
  bind('[data-action="cal-today"]', ()=>{ ui.calendarDate=todayStr(); render(); });
  bind('[data-goto-day]', function(){ ui.calendarDate=this.getAttribute('data-goto-day'); ui.calendarView='day'; render(); }, true);

  // Add-to-calendar (planned activities)
  bind('[data-action="open-add-planned"]', ()=>{ ui.modal={type:'add-planned', date:ui.calendarDate}; render(); });
  bind('[data-action="plan-quickdate"]', function(){
    const off=parseInt(this.getAttribute('data-offset'))||0;
    const d=new Date(); d.setDate(d.getDate()+off);
    const el=document.getElementById('plan-date');
    if(el) el.value = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  }, true);
  bind('#plan-repeat', null, false, 'change', function(){
    document.getElementById('plan-weekday-picker').style.display = this.value==='weekly'? 'block':'none';
  });
  bind('[data-action="save-planned-new"]', ()=>{
    const title=document.getElementById('plan-title').value.trim();
    const date=document.getElementById('plan-date').value;
    const categoryId=document.getElementById('plan-cat').value;
    const startTime=document.getElementById('plan-start').value;
    const endTime=document.getElementById('plan-end').value;
    const project=document.getElementById('plan-project').value;
    const client=document.getElementById('plan-client').value;
    const importance=document.getElementById('plan-importance').value;
    const repeat=document.getElementById('plan-repeat').value;
    const base={title,date,categoryId,startTime,endTime,project,client,importance};
    if(repeat==='none'){
      createPlannedActivity(base);
    } else if(repeat==='daily'){
      generateRecurringInstances(base, {freq:'daily'}, 60);
    } else {
      const days = Array.from(document.querySelectorAll('.plan-weekday:checked')).map(el=>parseInt(el.value));
      if(days.length===0){ showToast('Pick at least one weekday.'); return; }
      generateRecurringInstances(base, {freq:'weekly', daysOfWeek:days}, 90);
    }
    scheduleSave(); ui.modal=null; render();
    showToast('Added to calendar.');
  });
  bind('[data-action="save-planned-edit"]', function(){
    const id=this.getAttribute('data-id');
    updatePlannedActivity(id, {
      title:document.getElementById('plan-title').value.trim(),
      date:document.getElementById('plan-date').value,
      categoryId:document.getElementById('plan-cat').value,
      startTime:document.getElementById('plan-start').value,
      endTime:document.getElementById('plan-end').value,
      project:document.getElementById('plan-project').value,
      client:document.getElementById('plan-client').value,
      importance:document.getElementById('plan-importance').value,
    });
    ui.modal=null; render();
    showToast('Planned activity updated.');
  }, true);
  bind('[data-action="edit-planned"]', function(){
    const id=this.getAttribute('data-id');
    ui.modal={type:'add-planned', editId:id};
    render();
  }, true);
  bind('[data-action="delete-planned"]', function(){
    ui.modal={type:'delete-planned-confirm', id:this.getAttribute('data-id')};
    render();
  }, true);
  bind('[data-action="delete-planned-confirm-yes"]', function(){
    const id=this.getAttribute('data-id');
    deletePlannedActivity(id);
    ui.modal=null; render();
    showToastAction('Planned activity deleted.', 'Undo', ()=>{
      const p = state.plannedActivities.find(x=>x.id===id);
      if(p){ p.deletedAt=null; scheduleSave(); render(); }
    });
  }, true);
  bind('[data-action="log-planned-now"]', function(){
    const id=this.getAttribute('data-id');
    const p = state.plannedActivities.find(x=>x.id===id);
    if(!p) return;
    ui.editDraft = newDraftActivity({
      title:p.title, date:p.date, startTime:p.startTime, endTime:p.endTime,
      categoryId:p.categoryId, project:p.project, client:p.client, importance:p.importance,
      planned:true, originalInput: p.title,
    });
    ui.editDraft.__linkPlannedId = id;
    ui.modal=null; ui.tab='add'; ui.addStage='full-edit';
    render();
  }, true);

  // Convert a completed activity into a recurring plan
  bind('[data-action="open-convert-recurring"]', function(){
    ui.modal={type:'convert-recurring', activityId:this.getAttribute('data-id')};
    render();
  }, true);
  bind('[data-action="convert-recurring-confirm"]', function(){
    const activityId=this.getAttribute('data-id');
    const freq=document.getElementById('recur-freq').value;
    const horizon=parseInt(document.getElementById('recur-horizon').value)||60;
    let recurrence;
    if(freq==='daily') recurrence={freq:'daily'};
    else{
      const days=Array.from(document.querySelectorAll('.recur-weekday:checked')).map(el=>parseInt(el.value));
      if(days.length===0){ showToast('Pick at least one weekday.'); return; }
      recurrence={freq:'weekly', daysOfWeek:days};
    }
    const result = convertActivityToRecurring(activityId, recurrence, horizon);
    ui.modal=null; render();
    showToast(result? `Created ${result.count} scheduled instances.` : 'Could not create the series.');
  }, true);

  // Drag & resize engine — attach to every calendar block rendered this pass
  root.querySelectorAll('.cal-block-planned, .cal-block-actual').forEach(el=>{
    el.addEventListener('pointerdown', onCalBlockPointerDown);
  });

  // Tap an empty grid slot to add a planned activity at that time
  root.querySelectorAll('.cal-col-body').forEach(el=>{
    el.addEventListener('click', function(e){
      if(e.target!==this && !e.target.classList.contains('cal-hourline')) return;
      const rect = this.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const min = ui.gridStartHour*60 + y/ui.pxPerMin;
      const snapped = snapMinutes(min, 15);
      ui.modal = {type:'add-planned', date:this.getAttribute('data-col-body'), startTime:minToTimeStr(snapped), endTime:minToTimeStr(snapped+60)};
      render();
    });
  });

  // Charts
  bind('#charts-range', null, false, 'change', function(){ ui.chartsRange=this.value; render(); });
  bind('#charts-custom-from', null, false, 'change', function(){ ui.chartsCustomFrom=this.value; render(); });
  bind('#charts-custom-to', null, false, 'change', function(){ ui.chartsCustomTo=this.value; render(); });

  bind('[data-action="drill-category"]', function(){
    const catid=this.getAttribute('data-catid');
    const [from,to]=rangeDates(ui.chartsRange);
    openDrilldown(`${catShortBreadcrumb(catid)} — ${rangeLabel(ui.chartsRange)}`, activitiesInDateRange(from,to).filter(a=>a.categoryId===catid));
  }, true);
  bind('[data-action="drill-project"]', function(){
    const project=this.getAttribute('data-project');
    const [from,to]=rangeDates(ui.chartsRange);
    openDrilldown(`${project} — ${rangeLabel(ui.chartsRange)}`, activitiesInDateRange(from,to).filter(a=>a.project===project));
  }, true);
  bind('[data-action="drill-client"]', function(){
    const client=this.getAttribute('data-client');
    const [from,to]=rangeDates(ui.chartsRange);
    openDrilldown(`${client} — ${rangeLabel(ui.chartsRange)}`, activitiesInDateRange(from,to).filter(a=>a.client===client));
  }, true);
  bind('[data-action="drill-productivity"]', function(){
    const value=this.getAttribute('data-value');
    const [from,to]=rangeDates(ui.chartsRange);
    const set = value==='high'? ['productive','necessary'] : ['low-value','avoidable'];
    openDrilldown(`${value==='high'?'Productive/necessary':'Low-value/avoidable'} — ${rangeLabel(ui.chartsRange)}`, activitiesInDateRange(from,to).filter(a=>set.includes(a.productivity)));
  }, true);
  bind('[data-action="drill-revenue"]', function(){
    const value=this.getAttribute('data-value');
    const [from,to]=rangeDates(ui.chartsRange);
    openDrilldown(`${value==='revenue-generating'?'Revenue-generating':'Non-revenue / admin'} — ${rangeLabel(ui.chartsRange)}`, activitiesInDateRange(from,to).filter(a=>a.revenue===value));
  }, true);
  bind('[data-action="drill-planned-actual"]', function(){
    const value=this.getAttribute('data-value');
    const [from,to]=rangeDates(ui.chartsRange);
    if(value==='planned'){

function voiceInput(targetId, isPending){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast('Voice input not supported in this browser. Try typing instead.'); return; }
  const rec = new SR();
  rec.lang='en-US'; rec.interimResults=false;
  showToast('Listening...');
  rec.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    const el = document.getElementById(targetId);
    if(el){ el.value = (el.value? el.value+' ':'') + text; }
    if(isPending && ui.pendingActivity){ ui.pendingActivity.originalInput = (ui.pendingActivity.originalInput? ui.pendingActivity.originalInput+' ':'') + text; render(); }
  };
  rec.onerror = ()=>showToast('Voice input failed — you can type instead.');
  rec.start();
}

function downloadFile(content, filename, mime){

}

// ---- Calendar export (.ics — works with Google/Outlook/Apple calendar imports) ----
function icsEscape(s){ return String(s||'').replace(/([,;])/g,'\\$1').replace(/\n/g,'\\n'); }
function toIcsDate(dateStr,timeStr){
  const parts=(dateStr||todayStr()).split('-');
  const [hh,mm]=(timeStr||'00:00').split(':');
  return `${parts[0]}${parts[1]}${parts[2]}T${(hh||'00').padStart(2,'0')}${(mm||'00').padStart(2,'0')}00`;
}
function exportCalendarIcs(){
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Raheel Time Intelligence//EN'];
  function addEvent(item, kind){
    if(!item.date || !item.startTime) return;
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+(item.id||uid('evt'))+'@raheel-time-intelligence');
    lines.push('DTSTAMP:'+toIcsDate(todayStr(), pad2(new Date().getHours())+':'+pad2(new Date().getMinutes())));
    lines.push('DTSTART:'+toIcsDate(item.date, item.startTime));
    lines.push('DTEND:'+toIcsDate(item.date, item.endTime||item.startTime));
    lines.push('SUMMARY:'+icsEscape((kind==='planned'?'[Planned] ':'')+(item.title||'Untitled')));
    lines.push('CATEGORIES:'+icsEscape(catBreadcrumbStr(item.categoryId)));
    if(item.client||item.project) lines.push('DESCRIPTION:'+icsEscape([item.client?'Client: '+item.client:'', item.project?'Project: '+item.project:''].filter(Boolean).join(' | ')));
    lines.push('END:VEVENT');
  }
  activePlanned().forEach(p=>addEvent(p,'planned'));
  activeActivities().forEach(a=>addEvent(a,'actual'));
  lines.push('END:VCALENDAR');
  downloadFile(lines.join('\r\n'), 'raheel-calendar.ics', 'text/calendar');
}

function buildReportHtml(from,to){
  const list = activitiesInDateRange(from,to);

  const byCat={}; list.forEach(a=>{ byCat[a.categoryId]=(byCat[a.categoryId]||0)+(a.durationMin||0); });
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const byProj={}; list.forEach(a=>{ if(a.project) byProj[a.project]=(byProj[a.project]||0)+(a.durationMin||0); });
  const projRows=Object.entries(byProj).sort((a,b)=>b[1]-a[1]);
  const top = list.slice().sort((a,b)=>(b.durationMin||0)-(a.durationMin||0)).slice(0,12);
  const trow = (a,b)=>`<tr><td style="padding:6px;border:1px solid #ccc">${a}</td><td style="padding:6px;border:1px solid #ccc">${b}</td></tr>`;
  return `
    <h1 style="font-family:Georgia,serif;color:#3d0a14;margin-bottom:2px">Raheel Time Intelligence — Activity Report</h1>
    <p style="color:#5c4f47">${from} to ${to} · ${list.length} activities · ${minutesToHM(totalMin)} total recorded</p>
    <h2 style="font-family:Georgia,serif;color:#691D1F">Time by category</h2>
    <table style="width:100%;border-collapse:collapse">${catRows.map(([id,m])=>trow(escapeHtml(catBreadcrumbStr(id)), minutesToHM(m))).join('')}</table>
    <h2 style="font-family:Georgia,serif;color:#691D1F;margin-top:20px">Time by project</h2>
    <table style="width:100%;border-collapse:collapse">${projRows.length? projRows.map(([n,m])=>trow(escapeHtml(n), minutesToHM(m))).join('') : '<tr><td style="padding:6px">No project-tagged activities.</td></tr>'}</table>
    <h2 style="font-family:Georgia,serif;color:#691D1F;margin-top:20px">Top activities</h2>
    <table style="width:100%;border-collapse:collapse">
      <tr><th style="padding:6px;border:1px solid #ccc;text-align:left">Date</th><th style="padding:6px;border:1px solid #ccc;text-align:left">Title</th><th style="padding:6px;border:1px solid #ccc;text-align:left">Category</th><th style="padding:6px;border:1px solid #ccc;text-align:left">Duration</th></tr>
      ${top.map(a=>`<tr><td style="padding:6px;border:1px solid #ccc">${a.date}</td><td style="padding:6px;border:1px solid #ccc">${escapeHtml(a.title||'')}</td><td style="padding:6px;border:1px solid #ccc">${escapeHtml(catBreadcrumbStr(a.categoryId))}</td><td style="padding:6px;border:1px solid #ccc">${minutesToHM(a.durationMin)}</td></tr>`).join('')}
    </table>
  `;
}
function printReport(from,to){

  if(!container){ container = document.createElement('div'); container.id='rti-print-report'; document.body.appendChild(container); }

}

function fingerprintOf(a){ return (a.date||'')+'|'+(a.startTime||'')+'|'+normName(a.title||''); }

function parseCsv(text){
  const rows=[]; let row=[]; let field=''; let inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip */ }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function freshActivityShell(overrides){
  return Object.assign({
    id:null, createdAt:Date.now(), updatedAt:Date.now(), deletedAt:null,
    classificationHistory:[], editHistory:[], reviewFlags:[], aiOriginalClassification:null, confidence:null, aiPending:false,
  }, overrides);
}
function csvRowsToActivities(rows){
  if(rows.length<2) return [];
  const header = rows[0].map(h=>h.trim());
  const idx = name=>header.indexOf(name);
  const get=(r,name)=>{ const i=idx(name); return i>=0? (r[i]||'') : ''; };
  return rows.slice(1).filter(r=>r.length>1 && r.some(v=>v!=='')).map(r=>freshActivityShell({
    date:get(r,'Date'), startTime:get(r,'Start'), endTime:get(r,'End'),
    durationMin: parseInt(get(r,'Duration(min)'))||null,
    title:get(r,'Title'), originalInput:get(r,'Original Input')||get(r,'Title'),
    categoryPathText:get(r,'Category Path'), project:get(r,'Project'), client:get(r,'Client'),
    importance:get(r,'Importance')||'medium', planned:get(r,'Planned')==='true',
    productivity:get(r,'Productivity')||'necessary', revenue:get(r,'Revenue')||'non-revenue',
    followUpNeeded:get(r,'FollowUp')==='true', followUpDate:get(r,'FollowUpDate')||null, nextAction:get(r,'NextAction')||'',
  }));
}
function normalizeDateValue(v){
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v==='number' && window.XLSX && XLSX.SSF){
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${pad2(d.m)}-${pad2(d.d)}`;
  }
  return String(v||'').slice(0,10);
}
function excelRowsToActivities(rows){
  return rows.map(r=>freshActivityShell({
    date: normalizeDateValue(r.Date), startTime:String(r.Start||''), endTime:String(r.End||''),
    durationMin: r.DurationMin!=null? parseInt(r.DurationMin): null,
    title:r.Title||'', originalInput:r.OriginalInput||r.Title||'',
    categoryPathText:r.CategoryPath||'', project:r.Project||'', client:r.Client||'',
    importance:r.Importance||'medium', planned: r.Planned===true||r.Planned==='true',
    productivity:r.Productivity||'necessary', revenue:r.Revenue||'non-revenue',
    followUpNeeded: r.FollowUpNeeded===true||r.FollowUpNeeded==='true', followUpDate:r.FollowUpDate||null, nextAction:r.NextAction||'',
  }));
}

function buildImportPreview(imported){
  const acts = imported.activities||[];
  let newCount=0, dupCount=0, invalidCount=0;
  const existingIds = new Set(state.activities.map(a=>a.id));
  const existingFingerprints = new Set(state.activities.map(fingerprintOf));
  const categoriesToCreate = new Set();
  let minDate=null, maxDate=null;

  acts.forEach(a=>{
    const invalid = !a.date || !/^\d{4}-\d{2}-\d{2}$/.test(a.date) || a.originalInput===undefined || a.originalInput===null;
    if(invalid){ invalidCount++; return; }
    if(!minDate||a.date<minDate) minDate=a.date;
    if(!maxDate||a.date>maxDate) maxDate=a.date;
    if(a.id && existingIds.has(a.id)) dupCount++;
    else if(existingFingerprints.has(fingerprintOf(a))) dupCount++;
    else newCount++;
    if(a.categoryPathText){
      const path = a.categoryPathText.split('→').map(s=>s.trim()).filter(Boolean);
      let parentId=null, missing=false;
      path.forEach(name=>{
        const existing = state.categories.find(c=>c.parentId===parentId && normName(c.name)===normName(name));
        if(!existing) missing=true;
        parentId = existing? existing.id : null;
      });
      if(missing) categoriesToCreate.add(path.join(' → '));
    } else if(a.categoryId && !state.categories.find(c=>c.id===a.categoryId)){
      categoriesToCreate.add('(unrecognised category reference — will use your default category)');
    }
  });

  return {
    totalRecords: acts.length,
    newCount, dupCount, invalidCount,
    categoriesToCreate: Array.from(categoriesToCreate),
    dateRange: minDate&&maxDate? `${minDate} to ${maxDate}` : '—',
    plannedCount: (imported.plannedActivities||[]).length,
    categoriesCount: (imported.categories||[]).length,
    rulesCount: (imported.rules||[]).length,
    goalsCount: (imported.goals||[]).length,
  };
}

async function handleImportFile(file){
  const name = file.name.toLowerCase();
  try{
    let imported = {activities:[], plannedActivities:[], categories:[], rules:[], goals:[]};
    if(name.endsWith('.json')){
      const text = await file.text();
      const obj = JSON.parse(text);
      if(typeof obj!=='object' || obj===null) throw new Error('File is not a valid JSON object.');
      imported.activities = Array.isArray(obj.activities)? obj.activities : [];
      imported.plannedActivities = Array.isArray(obj.plannedActivities)? obj.plannedActivities : [];
      imported.categories = Array.isArray(obj.categories)? obj.categories : [];
      imported.rules = Array.isArray(obj.rules)? obj.rules : [];
      imported.goals = Array.isArray(obj.goals)? obj.goals : [];
    } else if(name.endsWith('.csv')){
      const text = await file.text();
      imported.activities = csvRowsToActivities(parseCsv(text));
    } else if(name.endsWith('.xlsx') || name.endsWith('.xls')){
      if(typeof XLSX==='undefined') throw new Error('Excel import library is unavailable right now — try CSV or JSON instead.');
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});
      const actSheet = wb.SheetNames.find(n=>/activit/i.test(n)) || wb.SheetNames[0];
      imported.activities = excelRowsToActivities(XLSX.utils.sheet_to_json(wb.Sheets[actSheet]));
      const calSheet = wb.SheetNames.find(n=>/calendar/i.test(n));
      if(calSheet){
        imported.plannedActivities = XLSX.utils.sheet_to_json(wb.Sheets[calSheet]).map(r=>({
          id:uid('plan'), title:r.Title||'', date:normalizeDateValue(r.Date), startTime:String(r.Start||''), endTime:String(r.End||''),
          durationMin: r.DurationMin!=null? parseInt(r.DurationMin): 30, categoryPathText: r.CategoryPath||'',
          project:r.Project||'', client:r.Client||'', importance:'medium', linkedActivityId:null, seriesId:null,
          createdAt:Date.now(), updatedAt:Date.now(), deletedAt:null,
        }));
      }
    } else {
      throw new Error('Unsupported file type — please use .json, .csv, or .xlsx.');
    }
    ui.pendingImport = imported;
    ui.pendingImport.preview = buildImportPreview(imported);
    ui.modal = {type:'import-preview'};
    render();
  }catch(e){
    logError('import', 'Failed to parse import file "'+file.name+'"', e && e.message);
    showToast('Could not read that file — '+((e&&e.message)||'unknown error'));
  }
}

function resolveImportCategoryRefs(activities){
  activities.forEach(a=>{
    if(a.categoryPathText){
      const path = a.categoryPathText.split('→').map(s=>s.trim()).filter(Boolean);
      a.categoryId = (path.length? resolveOrCreateCategoryPath(path, 'import') : null) || catTopLevel()[0]?.id;
      delete a.categoryPathText;
    } else if(a.categoryId && !state.categories.find(c=>c.id===a.categoryId)){
      a.categoryId = catTopLevel()[0]?.id;
    }
  });
}
function mergeById(target, incoming, isActivity, counts){
  incoming.forEach(item=>{
    let existing = item.id ? target.find(x=>x.id===item.id) : null;
    if(!existing && isActivity){
      existing = target.find(x=>x.date===item.date && x.startTime===item.startTime && normName(x.title||'')===normName(item.title||''));
    }
    if(!item.id) item.id = uid(isActivity?'act':'rec');
    if(!existing){ target.push(item); counts.added++; }
    else{
      const exUpd=existing.updatedAt||0, inUpd=item.updatedAt||0;
      if(inUpd>=exUpd){
        const lockedOriginal = isActivity? existing.originalInput : undefined;
        Object.assign(existing, item);
        if(isActivity) existing.originalInput = lockedOriginal; // original entry is never overwritten, even on import
        counts.updated++;
      } else counts.skipped++;
    }
  });
}
async function commitImportMerge(){
  const imp = ui.pendingImport;
  if(!imp) return;
  await backupSnapshot('pre-import-merge');
  const validActivities = imp.activities.filter(a=>a.date && /^\d{4}-\d{2}-\d{2}$/.test(a.date) && a.originalInput!=null);
  resolveImportCategoryRefs(validActivities);
  const counts = {added:0, updated:0, skipped:0};
  mergeById(state.activities, validActivities, true, counts);
  mergeById(state.plannedActivities, imp.plannedActivities||[], false, counts);
  mergeById(state.categories, imp.categories||[], false, counts);
  mergeById(state.rules, imp.rules||[], false, counts);
  mergeById(state.goals, imp.goals||[], false, counts);
  scheduleSave();
  ui.pendingImport=null; ui.modal=null; render();
  showToast(`Import complete — ${counts.added} added, ${counts.updated} updated, ${counts.skipped} skipped (already up to date).`);
}
async function commitImportReplace(){
  const imp = ui.pendingImport;
  if(!imp) return;
  await backupSnapshot('pre-import-replace');
  const validActivities = imp.activities.filter(a=>a.date && /^\d{4}-\d{2}-\d{2}$/.test(a.date) && a.originalInput!=null);
  resolveImportCategoryRefs(validActivities);
  state.activities = validActivities;
  state.plannedActivities = imp.plannedActivities||[];
  if(imp.categories && imp.categories.length) state.categories = imp.categories;
  state.rules = imp.rules||[];
  state.goals = imp.goals||[];
  await runMigrations();
  scheduleSave();
  ui.pendingImport=null; ui.modal=null; render();
  showToast('All data replaced with the imported file.');
}

loadState();
})();
</script>
